name: One-time verified v0.2.79 original-key signed APK publication
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: yellow-hat-v0279-single-publication
  cancel-in-progress: false
jobs:
  publish-signed-apk:
    if: github.event.head_commit.message == 'Execute verified v0.2.79 publication [one-shot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged manifest, reconstruct original-key signed APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.version' version.json)" = "0.2.78"
          test "$(jq -er '.versionCode' version.json)" = "80"
          test "$(jq -er '.version' staging/version.json)" = "0.2.79"
          test "$(jq -er '.versionCode' staging/version.json)" = "81"
          test "$(jq -er '.mode' staging/release.json)" = "verified_unsigned_bundle_delta_v1"
          output="$(jq -er '.output' staging/release.json)"
          test "$output" = "releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.79.apk"
          signed_sha="$(jq -er '.sha256' staging/release.json)"
          test "$signed_sha" = "9d4a0ba8621fb4b2647a88dd0b0f8dcb6b64641e627b4256586448aae300ad76"
          url="$(jq -er '.unsignedBundleUrl' staging/release.json)"
          case "$url" in https://*.oaiusercontent.com/files/*) ;; *) echo "Unsupported public unsigned artifact transfer host" >&2; exit 1;; esac
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 "$url" -o /tmp/yh-unsigned-only.zip
          echo "$(jq -er '.unsignedBundleSha256' staging/release.json)  /tmp/yh-unsigned-only.zip" | sha256sum --check -
          test "$(unzip -Z1 /tmp/yh-unsigned-only.zip | wc -l)" -eq 1
          unzip -Z1 /tmp/yh-unsigned-only.zip | grep -Fx 'app-release-unsigned.apk'
          unzip -p /tmp/yh-unsigned-only.zip app-release-unsigned.apk > /tmp/yh-unsigned-v0279.apk
          echo "$(jq -er '.unsignedApkSha256' staging/release.json)  /tmp/yh-unsigned-v0279.apk" | sha256sum --check -
          cat staging/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/yh-signed-v0279-delta.zst
          echo "$(jq -er '.patchSha256' staging/release.json)  /tmp/yh-signed-v0279-delta.zst" | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from=/tmp/yh-unsigned-v0279.apk /tmp/yh-signed-v0279-delta.zst -o "$output"
          echo "$signed_sha  $output" | sha256sum --check -
          unzip -tqq "$output"
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/35.0.0"
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          "$tools/apksigner" verify --verbose --print-certs "$output" > /tmp/yh-v0279-signer.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/yh-v0279-signer.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/yh-v0279-signer.txt
          "$tools/aapt" dump badging "$output" | grep -F "name='com.yellowhatresale.taxes' versionCode='81' versionName='0.2.79'"
          echo "Exact original-key signed v0.2.79 verified; existing v0.2.78 feed unchanged."
      - name: Publish immutable signed asset, verify readback, update live feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="0.2.79"
          name="Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.79.apk"
          file="releases/$name"
          sha="9d4a0ba8621fb4b2647a88dd0b0f8dcb6b64641e627b4256586448aae300ad76"
          gh release view v0.2.78 --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! gh release view v0.2.79 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.79 "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yellow Hat Resale v0.2.79" \
              --notes "Verified original-key signed Android APK, source version 0.2.79 / code 81. SHA-256: $sha. Historical 18-owner synthetic compatibility, backup, restore, and sync regression passed. v0.2.78 retained for rollback."
          fi
          mkdir -p /tmp/yh-v0279-public-readback
          gh release download v0.2.79 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir /tmp/yh-v0279-public-readback
          echo "$sha  /tmp/yh-v0279-public-readback/$name" | sha256sum --check -
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v0.2.79/$name"
          jq --arg v "$version" --arg url "$url" --arg sha "$sha" \
            --arg now "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '.version=$v | .versionCode=81 | .apkUrl=$url | .sha256=$sha | .publishedAt=$now' \
            version.json > /tmp/yh-v0279-feed.json
          mv /tmp/yh-v0279-feed.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git rm -r staging .github/workflows/v0279-one-shot-publish.yml
          git commit -m "Publish verified original-key signed v0.2.79 and retire one-shot publisher"
          git push
          test "$(gh api repos/$GITHUB_REPOSITORY/contents/version.json --jq .content | base64 -d | jq -er .version)" = "0.2.79"
          gh release view v0.2.79 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v0.2.78 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "PUBLISHED v0.2.79 code81 with immutable signed-APK readback, feed verification and v0.2.78 rollback."
