name: Yellow Hat v3.0.12 signed verified prerelease (one-time)
on:
  push:
    branches:
      - release/v312-signed-prerelease-one-time-20261123
    paths:
      - .github/workflows/v312-publish-prerelease-once.yml
permissions:
  contents: write
concurrency:
  group: v312-signed-prerelease-once
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'release: verified signed v3.0.12 prerelease (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare signed APK verifier and reconstruct exact signed bytes
        shell: bash
        env:
          UNSIGNED_BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-8390-81fd-9d8a-833ddf89fe80/raw?se=2026-11-24T01%3A40%3A22Z&sp=r&sv=2026-06-06&sr=b&scid=4e6c8171-7312-5ec9-8fab-01056aaeeabd&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T00%3A14%3A57Z&ske=2026-11-25T00%3A14%3A57Z&sks=b&skv=2026-06-06&sig=MAgzdMslMr1PqM1kGHKgo7Hi/cvEdII8l3drARAF7JM%3D'
        run: |
          set -euo pipefail
          SOURCE_SHA='913da6c121e121fd82c5bf1d5d457806fa5d8938'
          META='.v312-signed-stage/manifest.json'
          test -s "$META"
          test "$(jq -er .version "$META")" = '3.0.12'
          test "$(jq -er .versionCode "$META")" = '114'
          test "$(jq -er .sourceSha "$META")" = "$SOURCE_SHA"
          test "$(jq -er .sourceBuildRun "$META")" = '45305354904'
          test "$(jq -er .versionCode version.json)" -lt 114
          EXPECT_BUNDLE="$(jq -er .unsignedBundleSha256 "$META")"
          EXPECT_UNSIGNED="$(jq -er .unsignedApkSha256 "$META")"
          EXPECT_PATCH="$(jq -er .patchSha256 "$META")"
          EXPECT_SIGNED="$(jq -er .signedApkSha256 "$META")"
          EXPECT_CERT="$(jq -er .signingCertificateSha256 "$META")"
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.12.apk'
          test "$(jq -er .artifact "$META")" = "$NAME"
          case "$UNSIGNED_BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) echo 'Unapproved bundle host'; exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$UNSIGNED_BUNDLE_URL" -o /tmp/yhr-v312-unsigned-bundle.zip
          echo "$EXPECT_BUNDLE  /tmp/yhr-v312-unsigned-bundle.zip" | sha256sum --check
          unzip -p /tmp/yhr-v312-unsigned-bundle.zip app-release-unsigned.apk > /tmp/yhr-v312-unsigned.apk
          echo "$EXPECT_UNSIGNED  /tmp/yhr-v312-unsigned.apk" | sha256sum --check
          base64 -d .v312-signed-stage/signed-delta.b64 > /tmp/yhr-v312-signed-delta.zst
          echo "$EXPECT_PATCH  /tmp/yhr-v312-signed-delta.zst" | sha256sum --check
          command -v zstd >/dev/null
          mkdir -p releases
          zstd --patch-from=/tmp/yhr-v312-unsigned.apk -d -q -f /tmp/yhr-v312-signed-delta.zst -o "releases/$NAME"
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          test "$(stat -c '%s' "releases/$NAME")" = "$(jq -er .signedApkSize "$META")"
          unzip -tq "releases/$NAME" >/dev/null
          if [ ! -f "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
            test -n "$sdkmanager_path"
            "$sdkmanager_path" 'build-tools;35.0.0'
          fi
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "releases/$NAME" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "releases/$NAME" > /tmp/yhr-v312-badging.txt
          grep -Eq "package: name='com.yellowhatresale.taxes' versionCode='114' versionName='3.0.12'" /tmp/yhr-v312-badging.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "releases/$NAME" > /tmp/yhr-v312-signature.txt
          grep -Fiq "$EXPECT_CERT" /tmp/yhr-v312-signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/yhr-v312-signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/yhr-v312-signature.txt
          gh --version >/dev/null
          echo 'PASS: v3.0.12 unsigned CI provenance, patch and original-key signed APK validated.'
      - name: Publish and read back immutable prerelease asset, preserve v3.0.11 and updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.12.apk'
          EXPECT_SIGNED="$(jq -er .signedApkSha256 .v312-signed-stage/manifest.json)"
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          if gh release view v3.0.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view v3.0.12 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = 'true'
          else
            gh release create v3.0.12 "releases/$NAME" \
              --repo "$GITHUB_REPOSITORY" --prerelease --target main \
              --title 'Yellow Hat Resale v3.0.12 (prerelease)' \
              --notes "Verified original-key-signed v3.0.12 Android prerelease. Exact source SHA 913da6c121e121fd82c5bf1d5d457806fa5d8938. APK SHA-256: $EXPECT_SIGNED. Existing v3.0.11 retained. Production update feed unchanged."
          fi
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download v3.0.12 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/readback"
          echo "$EXPECT_SIGNED  $RUNNER_TEMP/readback/$NAME" | sha256sum --check
          gh release view v3.0.11 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "PUBLISHED v3.0.12 prerelease: downloaded asset hash verified $EXPECT_SIGNED, rollback retained, live feed untouched"
