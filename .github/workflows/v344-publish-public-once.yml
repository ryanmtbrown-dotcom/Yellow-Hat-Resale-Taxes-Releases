name: Publish verified v3.0.44
on:
  push:
    branches: [release/v344-public-one-time-20261126]
    paths: [.github/workflows/v344-publish-public-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'release: verified signed v3.0.44 public updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify exact signed APK
        env:
          BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-854c-81fd-870a-6347034d2da5/raw?se=2026-11-26T18%3A51%3A13Z&sp=r&sv=2026-06-06&sr=b&scid=cf9367af-7faf-5cce-973a-fe646704544e&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T22%3A44%3A38Z&ske=2026-11-26T22%3A44%3A38Z&sks=b&skv=2026-06-06&sig=T7nMGNOjxews2PjVsxkr8e6%2BeUL5FTunKH5LqPXr134%3D'
        run: |
          set -euo pipefail
          mkdir -p .release-staging
          printf '%s\n' '{"artifact":"Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.44.apk","unsignedBundleSha256":"4aab330a3786b7173f0932f69100d5e19f8d27c27edb40a49f40a7bc32753970","unsignedApkSha256":"2c6b9f9f1d74ec2ec6296feee4b563155f5a73ee92235aa020144ec72c5c1a6a","patchSha256":"97d662fc694f0d0e2a64b9cc5ed45812a68aad8b0ae98607bb0afb63d6a540c3","signedApkSha256":"fc51fdf2bd102270e6fef21f626d2e97f77e7564418ad5be37546a51ba7bac8f","signedApkSize":7477650,"assets":462,"sourceSha":"e4f3da97ec06e947a86f30f410e5afe90b4b71a0","certificate":"48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4","regressionTests":"3352/3352 passed from exact extracted package"}' > .release-staging/v344-manifest.json
          printf '%s' '' > .release-staging/v344-signed-delta.b64
          M=.release-staging/v344-manifest.json
          case "$BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$BUNDLE_URL" -o /tmp/bundle.zip
          echo "$(jq -r .unsignedBundleSha256 "$M")  /tmp/bundle.zip" | sha256sum -c
          unzip -q /tmp/bundle.zip -d /tmp/yhr332
          find /tmp/yhr332 -type f
          U=$(find /tmp/yhr332 -type f -name '*.apk')
          S=$(find /tmp/yhr332 -type f -name EXACT_SOURCE.txt)
          test -f "$U"
          grep -F 'e4f3da97ec06e947a86f30f410e5afe90b4b71a0' "$S"
          echo "$(jq -r .unsignedApkSha256 "$M")  $U" | sha256sum -c
          cat .release-staging/v344-signed-delta.b64 | base64 -d > /tmp/delta.zst
          echo "$(jq -r .patchSha256 "$M")  /tmp/delta.zst" | sha256sum -c
          mkdir -p releases
          A="releases/$(jq -r .artifact "$M")"
          zstd --patch-from="$U" -d -q -f /tmp/delta.zst -o "$A"
          echo "$(jq -r .signedApkSha256 "$M")  $A" | sha256sum -c
          test "$(stat -c %s "$A")" = "$(jq -r .signedApkSize "$M")"
          python - "$U" "$A" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is None and b.testzip() is None
              def entries(z):
                  return {i.filename:hashlib.sha256(z.read(i)).hexdigest() for i in z.infolist() if not i.is_dir() and not i.filename.startswith('META-INF/')}
              x,y=entries(a),entries(b)
              assert x==y
              assert len([n for n in y if n.startswith('assets/www/')])==462
              print('Signed/unsigned payload parity and 462 web assets verified')
          PY
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/zipalign" -c -v 4 "$A" > /tmp/align.txt
          "$SDK/aapt" dump badging "$A" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='146' versionName='3.0.44'"
          "$SDK/apksigner" verify --verbose --print-certs "$A" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          grep -F 'Number of signers: 1' /tmp/sign.txt
      - name: Publish and verify release before updating feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M=.release-staging/v344-manifest.json
          A="releases/$(jq -r .artifact "$M")"
          HASH=$(jq -r .signedApkSha256 "$M")
          NAME=$(basename "$A")
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/old.json
          PREV=$(jq -r .sha /tmp/old.json)
          test "$PREV" = d2bdae6346b2cbeefacc03f60e220981fc60138f
          jq -r .content /tmp/old.json | base64 -d > /tmp/old-feed.json
          cat /tmp/old-feed.json
          gh release view v3.0.43 --repo "$GITHUB_REPOSITORY" >/dev/null
          for attempt in 1 2 3; do
            if gh release view v3.0.44 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            if gh release create v3.0.44 "$A" --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.44 — Portrait lock and compact Orders cards' --notes 'Portrait-only native app and Test Mode; handles rotation configuration changes without WebView recreation. Removes refund status badges from compact Orders cards while preserving refund records and calculations. All 3352 tests passed. No financial, tax, synchronization, database or Worker changes. Preserve v3.0.43 as rollback. Physical Android acceptance pending.'; then break; fi
            if [ "$attempt" = 3 ]; then gh release view v3.0.44 --repo "$GITHUB_REPOSITORY" >/dev/null; break; fi
            sleep $((attempt * 5))
          done
          gh release view v3.0.44 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | tee /tmp/release.json
          jq -e '.isDraft==false and .isPrerelease==false' /tmp/release.json
          mkdir -p /tmp/readback
          gh release download v3.0.44 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.44/$NAME"
          curl -fSsL --retry 3 "$URL" -o /tmp/public.apk
          echo "$HASH  /tmp/public.apk" | sha256sum -c
          PUB=$(gh release view v3.0.44 --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          test -n "$PUB"
          jq --arg publishedAt "$PUB" --arg url "$URL" --arg hash "$HASH" --arg source 'e4f3da97ec06e947a86f30f410e5afe90b4b71a0' '.version="3.0.44" | .versionCode=146 | .apkUrl=$url | .sha256=$hash | .sourceSha=$source | .publishedAt=$publishedAt' /tmp/old-feed.json > /tmp/new-feed.json
          cat /tmp/new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified v3.0.44 update feed' -f branch=main -f sha="$PREV" -f content="$(base64 -w0 /tmp/new-feed.json)" >/tmp/update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" --jq .content | base64 -d > /tmp/api-feed.json
          cmp /tmp/new-feed.json /tmp/api-feed.json
          for i in $(seq 1 36); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/version.json?verify=$(date +%s)" -o /tmp/raw-feed.json && cmp -s /tmp/new-feed.json /tmp/raw-feed.json; then
              echo 'PUBLIC APK AND UPDATE FEED VERIFIED'
              cat /tmp/raw-feed.json
              exit 0
            fi
            sleep 5
          done
          exit 1
