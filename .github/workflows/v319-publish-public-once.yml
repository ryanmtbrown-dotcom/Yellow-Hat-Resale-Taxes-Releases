name: Yellow Hat v3.0.19 signed verified public release (one-time)
on:
  push:
    branches:
      - release/v319-public-one-time-20261124
    paths:
      - .github/workflows/v319-publish-public-once.yml
permissions:
  contents: write
concurrency:
  group: v319-signed-public-once
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'release: verified signed v3.0.19 public updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare signed APK verifier and reconstruct exact signed bytes
        shell: bash
        env:
          UNSIGNED_BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9784-81fd-a068-37fc2d4176ba/raw?se=2026-11-24T05%3A46%3A02Z&sp=r&sv=2026-06-06&sr=b&scid=822e8c66-6df9-5f49-857b-b1b30e41fdec&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T23%3A54%3A29Z&ske=2026-11-24T23%3A54%3A29Z&sks=b&skv=2026-06-06&sig=/C%2BVrC2KWXdCEagxgP4rIMmjJ2JMp6/pOg8X7WndySA%3D'
        run: |
          set -euo pipefail
          SOURCE_SHA='67821ffb75ec6619c95f953f27f4c8037c49eb41'
          META='.v319-signed-stage/manifest.json'
          test -s "$META"
          test "$(jq -er .version "$META")" = '3.0.19'
          test "$(jq -er .versionCode "$META")" = '121'
          test "$(jq -er .sourceSha "$META")" = "$SOURCE_SHA"
          test "$(jq -er .sourceBuildRun "$META")" = '45334690955'
          test "$(jq -er .versionCode version.json)" -lt 121
          EXPECT_BUNDLE="$(jq -er .unsignedBundleSha256 "$META")"
          EXPECT_UNSIGNED="$(jq -er .unsignedApkSha256 "$META")"
          EXPECT_PATCH="$(jq -er .patchSha256 "$META")"
          EXPECT_SIGNED="$(jq -er .signedApkSha256 "$META")"
          EXPECT_CERT="$(jq -er .signingCertificateSha256 "$META")"
          test "$EXPECT_CERT" = '48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4'
          test "$EXPECT_SIGNED" = '8837593e24ff3ecd3def2088ea8125b80ac822f6ae65b5519183359ecf68f63f'
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.19.apk'
          test "$(jq -er .artifact "$META")" = "$NAME"
          case "$UNSIGNED_BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) echo 'Unapproved bundle host'; exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$UNSIGNED_BUNDLE_URL" -o /tmp/yhr-v319-unsigned-bundle.zip
          echo "$EXPECT_BUNDLE  /tmp/yhr-v319-unsigned-bundle.zip" | sha256sum --check
          unzip -p /tmp/yhr-v319-unsigned-bundle.zip app-release-unsigned.apk > /tmp/yhr-v319-unsigned.apk
          echo "$EXPECT_UNSIGNED  /tmp/yhr-v319-unsigned.apk" | sha256sum --check
          base64 -d .v319-signed-stage/signed-delta.b64 > /tmp/yhr-v319-signed-delta.zst
          echo "$EXPECT_PATCH  /tmp/yhr-v319-signed-delta.zst" | sha256sum --check
          command -v zstd >/dev/null
          mkdir -p releases
          zstd --patch-from=/tmp/yhr-v319-unsigned.apk -d -q -f /tmp/yhr-v319-signed-delta.zst -o "releases/$NAME"
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          test "$(stat -c '%s' "releases/$NAME")" = "$(jq -er .signedApkSize "$META")"
          unzip -tq "releases/$NAME" >/dev/null
          if [ ! -f "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
            test -n "$sdkmanager_path"
            "$sdkmanager_path" 'build-tools;35.0.0'
          fi
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "releases/$NAME" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "releases/$NAME" > /tmp/yhr-v319-badging.txt
          grep -Eq "package: name='com.yellowhatresale.taxes' versionCode='121' versionName='3.0.19'" /tmp/yhr-v319-badging.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "releases/$NAME" > /tmp/yhr-v319-signature.txt
          grep -Fiq "$EXPECT_CERT" /tmp/yhr-v319-signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/yhr-v319-signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/yhr-v319-signature.txt
          gh --version >/dev/null
          echo 'PASS: v3.0.19 unsigned CI provenance, patch and original-key signed APK validated.'
      - name: Publish signed public release and independently verify before promoting updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.19.apk'
          SOURCE_SHA='67821ffb75ec6619c95f953f27f4c8037c49eb41'
          EXPECT_SIGNED='8837593e24ff3ecd3def2088ea8125b80ac822f6ae65b5519183359ecf68f63f'
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/yhr-prev-feed-api.json
          PREV_BLOB="$(jq -er .sha /tmp/yhr-prev-feed-api.json)"
          test "$PREV_BLOB" = '1d30f19d6bbbd711c0290521fa23ec3cf2be4d51'
          jq -er .content /tmp/yhr-prev-feed-api.json | base64 -d > /tmp/yhr-prev-feed.json
          test "$(jq -er .version /tmp/yhr-prev-feed.json)" = '3.0.18'
          test "$(jq -er .versionCode /tmp/yhr-prev-feed.json)" = '120'
          test "$(jq -er .sha256 /tmp/yhr-prev-feed.json)" = '42369881fcd3809d43595a6c88ad63bc9ba76f7ee9f314400eaed51bfa05b07a'
          gh release view v3.0.18 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v3.0.17 --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! gh release view v3.0.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.0.19 "releases/$NAME" --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.19' --notes "Owner-authorized diagnostic testing release. Original signing key verified. Exact source SHA $SOURCE_SHA. APK SHA-256 $EXPECT_SIGNED. Scoped sync, consolidated authenticated authority checks, lower cloud workload and compact plain-language health screen. Preserves current records, encryption and pairing. Worker updated; D1 additive index migration pending provider quota reset. Physical two-phone validation pending. Prior releases retained."
          fi
          test "$(gh release view v3.0.19 --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq '.isPrerelease or .isDraft')" = 'false'
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download v3.0.19 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/readback"
          echo "$EXPECT_SIGNED  $RUNNER_TEMP/readback/$NAME" | sha256sum --check
          echo 'PASS public release asset downloaded and verified before updater promotion'
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.19/$NAME"
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 120 "$APK_URL" -o /tmp/yhr-public-apk.apk
          echo "$EXPECT_SIGNED  /tmp/yhr-public-apk.apk" | sha256sum --check
          jq -n --arg product 'Yellow Hat Resale Inventory and Taxes' --arg version '3.0.19' --argjson versionCode 121 --arg apkUrl "$APK_URL" --arg sha256 "$EXPECT_SIGNED" --arg sourceSha "$SOURCE_SHA" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{product:$product,version:$version,versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256,sourceSha:$sourceSha,publishedAt:$publishedAt}' > /tmp/yhr-new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified Android v3.0.19 and update feed' -f branch=main -f sha="$PREV_BLOB" -f content="$(base64 -w0 /tmp/yhr-new-feed.json)" > /tmp/yhr-feed-update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" | jq -er .content | base64 -d > /tmp/yhr-live-feed.json
          cmp /tmp/yhr-new-feed.json /tmp/yhr-live-feed.json
          raw_ok=0
          for attempt in $(seq 1 12); do
            if curl -fSsL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/version.json?check=$(date +%s%3N)" -o /tmp/yhr-raw-feed.json && cmp -s /tmp/yhr-new-feed.json /tmp/yhr-raw-feed.json; then
              raw_ok=1
              break
            fi
            sleep 5
          done
          test "$raw_ok" = 1
          echo 'PASS unauthenticated raw updater and APK verified'
          gh release view v3.0.18 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v3.0.17 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo 'PUBLISHED v3.0.19: exact signed public asset and updater feed independently verified; rollback releases retained'
