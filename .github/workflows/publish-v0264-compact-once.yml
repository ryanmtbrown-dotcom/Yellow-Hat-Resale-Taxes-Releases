name: One-time approved Yellow Hat v0.2.64 compact APK publisher
# Owner-approved one-time publisher; strict checks and self-removal after success.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0264-compact-once.yml'
      - 'staging/v0264-compact/release.json'
permissions:
  contents: write
concurrency:
  group: yellow-hat-v0264-approved-compact-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current public release and staged contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.version' version.json)" = '0.2.63'
          test "$(jq -er '.versionCode' version.json)" = '65'
          test "$(jq -er '.sha256' version.json)" = '565492153bac0413c013edef16a89db56f153511347357fb0450f3ec07059ac7'
          test "$(jq -er '.version' staging/v0264-compact/release.json)" = '0.2.64'
          test "$(jq -er '.versionCode' staging/v0264-compact/release.json)" = '66'
          test "$(jq -er '.sourceCommit' staging/v0264-compact/release.json)" = 'f1368d575944056c455bb64863b8b0cfa6247056'
          test "$(jq -er '.verifiedBuildRun' staging/v0264-compact/release.json)" = '42780380095'
          test "$(jq -er '.chunks|length' staging/v0264-compact/release.json)" = '16'
          test "$(jq -er '.signedApkSha256' staging/v0264-compact/release.json)" = '62236740e1923b601954a4c438f411361a6f58943cbe3e38feaf300eee144823'
          test "$(jq -er '.sha256' staging/v0264-compact/version.json)" = '62236740e1923b601954a4c438f411361a6f58943cbe3e38feaf300eee144823'
          gh release view v0.2.63 --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view v0.2.64 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.64 already exists; refusing overwrite' >&2; exit 1
          fi
      - name: Retrieve, reconstruct and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          META=staging/v0264-compact/release.json
          OUTPUT="$(jq -er '.output' "$META")"
          mkdir -p releases
          BASE64FILE="$RUNNER_TEMP/v0264-signed-transfer.b64"
          : > "$BASE64FILE"
          while IFS=$'\t' read -r sha expected_size; do
            test "${#sha}" = 40
            gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -er '.content' | base64 --decode > "$RUNNER_TEMP/segment.b64"
            test "$(wc -c < "$RUNNER_TEMP/segment.b64")" = "$expected_size"
            test "$(git hash-object --stdin < "$RUNNER_TEMP/segment.b64")" = "$sha"
            cat "$RUNNER_TEMP/segment.b64" >> "$BASE64FILE"
          done < <(jq -r '.chunks[] | [.blobSha, (.size|tostring)] | @tsv' "$META")
          test "$(wc -c < "$BASE64FILE")" = "$(jq -er '.base64Length' "$META")"
          base64 --decode "$BASE64FILE" > "$RUNNER_TEMP/v0264.signed.apk.zst"
          echo "$(jq -er '.compressedSha256' "$META")  $RUNNER_TEMP/v0264.signed.apk.zst" | sha256sum --check -
          test "$(stat -c %s "$RUNNER_TEMP/v0264.signed.apk.zst")" = "$(jq -er '.compressedBytes' "$META")"
          command -v zstd
          zstd -q -d -f "$RUNNER_TEMP/v0264.signed.apk.zst" -o "$OUTPUT"
          echo "$(jq -er '.signedApkSha256' "$META")  $OUTPUT" | sha256sum --check -
          test "$(stat -c %s "$OUTPUT")" = "$(jq -er '.signedApkBytes' "$META")"
          python3 - "$OUTPUT" <<'PYCODE'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
            assert z.testzip() is None
            assert len(z.namelist())==690
            assert b"version: '0.2.64'" in z.read('assets/www/src/config/app-metadata.js')
            assert z.read('AndroidManifest.xml').count('0.2.64'.encode('utf-16le'))==1
            assert not any(n.endswith('.so') for n in z.namelist())
          print('Exact compact APK and embedded version confirmed')
          PYCODE
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
          test -n "$SIGNER" && test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$OUTPUT" > "$RUNNER_TEMP/v0264-signer.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/v0264-signer.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/v0264-signer.txt"
          grep -Fi "$(jq -er '.certificateSha256' "$META")" "$RUNNER_TEMP/v0264-signer.txt"
      - name: Publish signed APK and verify public asset readback
        shell: bash
        run: |
          set -euo pipefail
          META=staging/v0264-compact/release.json
          OUTPUT="$(jq -er '.output' "$META")"
          SHA="$(jq -er '.signedApkSha256' "$META")"
          gh release create v0.2.64 "$OUTPUT" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Yellow Hat Resale v0.2.64' \
            --notes "Signed compact OCR update with tracked-envelope links, List-printing verification, LetterTrack label import and one-digit order deletion confirmation. Native compact-OCR run: 42780380095. Source commit: f1368d575944056c455bb64863b8b0cfa6247056. APK SHA-256: $SHA. Previous v0.2.63 retained for rollback."
          mkdir -p "$RUNNER_TEMP/v0264-readback"
          gh release download v0.2.64 --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$OUTPUT")" --dir "$RUNNER_TEMP/v0264-readback"
          echo "$SHA  $RUNNER_TEMP/v0264-readback/$(basename "$OUTPUT")" | sha256sum --check -
          gh release view v0.2.63 --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Atomically promote update feed and remove one-time staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.version' version.json)" = '0.2.63'
          jq --arg stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.publishedAt = $stamp' \
            staging/v0264-compact/version.json > "$RUNNER_TEMP/v0264-verified-feed.json"
          mv "$RUNNER_TEMP/v0264-verified-feed.json" version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git rm -r staging/v0264-compact .github/workflows/publish-v0264-compact-once.yml
          git commit -m 'Publish signed compact v0.2.64, update verified feed and remove temporary transport'
          git push origin HEAD:main
