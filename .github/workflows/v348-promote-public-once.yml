name: Promote verified v3.0.48 signed draft
on:
  push:
    branches: [release/v348-public-one-time-20261126]
    paths: [.github/workflows/v348-promote-public-once.yml]
permissions:
  contents: write
jobs:
  promote:
    if: >-
      github.event.head_commit.message == 'release: promote verified v3.0.48 signed draft and updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify staged signed APK, promote release and publish verified updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME=Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.48.apk
          HASH=3ef77ed2b0e0e1b04674327d38b3bdbbe2804815de10e7c3e5b3285fb2999fed
          SOURCE=64b25f6b25f3dfb999e1ae50d5583ee7fbdf84f7
          PREV=5de6f396b5f57e6f28a158d4597200d69169c2db
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/old.json
          test "$(jq -r .sha /tmp/old.json)" = "$PREV"
          jq -r .content /tmp/old.json | base64 -d > /tmp/old-feed.json
          jq -e '.version=="3.0.47" and .versionCode==149 and .sha256=="a51a2789354ea73e39b06cc4dfdbd38db28f608b9a5a801cec54b0a2ef5d7474"' /tmp/old-feed.json
          gh release view v3.0.47 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)>0'
          gh api "repos/$GITHUB_REPOSITORY/releases/460076697" > /tmp/draft.json
          jq -e --arg h "sha256:$HASH" --arg n "$NAME" '.draft==true and .tag_name=="v3.0.48" and (.assets|length)==1 and .assets[0].id==798524119 and .assets[0].name==$n and .assets[0].digest==$h and .assets[0].size==7720514' /tmp/draft.json
          mkdir -p /tmp/staged /tmp/readback
          gh release download v3.0.48 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/staged
          echo "$HASH  /tmp/staged/$NAME" | sha256sum -c
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/apksigner" verify --verbose --print-certs "/tmp/staged/$NAME" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          "$SDK/aapt" dump badging "/tmp/staged/$NAME" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='150' versionName='3.0.48'"
          gh release edit v3.0.48 --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY" --notes 'Polished Import Studio with one-time persistent connection, simplified review and controls. Prior recurring-billing usability retained. All 3562 mandatory tests, exact Android assets and original-key signing verified. Cloudflare Worker v13 deployed with the existing 32 contracts and 18 tools. v3.0.47 remains available for rollback.'
          gh release view v3.0.48 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,publishedAt | tee /tmp/release.json
          jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)==1' /tmp/release.json
          gh release download v3.0.48 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.48/$NAME"
          curl -fSsL --retry 3 --connect-timeout 15 --max-time 150 "$URL" -o /tmp/public.apk
          echo "$HASH  /tmp/public.apk" | sha256sum -c
          PUB=$(jq -r .publishedAt /tmp/release.json)
          test -n "$PUB"
          jq --arg publishedAt "$PUB" --arg url "$URL" --arg hash "$HASH" --arg source "$SOURCE" '.version="3.0.48" | .versionCode=150 | .apkUrl=$url | .sha256=$hash | .sourceSha=$source | .publishedAt=$publishedAt' /tmp/old-feed.json > /tmp/new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified v3.0.48 update feed' -f branch=main -f sha="$PREV" -f content="$(base64 -w0 /tmp/new-feed.json)" >/tmp/update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" --jq .content | base64 -d > /tmp/api-feed.json
          cmp /tmp/new-feed.json /tmp/api-feed.json
          for i in $(seq 1 36); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/version.json?verify=$(date +%s)" -o /tmp/raw-feed.json && cmp -s /tmp/new-feed.json /tmp/raw-feed.json; then
              echo 'PUBLIC APK AND UPDATE FEED VERIFIED'
              cat /tmp/raw-feed.json
              exit 0
            fi
            sleep 5
          done
          exit 1
