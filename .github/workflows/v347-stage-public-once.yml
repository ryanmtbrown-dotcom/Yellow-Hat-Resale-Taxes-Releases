name: Stage verified v3.0.47 draft APK
on:
  push:
    branches: [release/v347-public-one-time-20261126]
    paths: [.github/workflows/v347-stage-public-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'stage: verified signed v3.0.47 draft APK (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify exact signed APK
        env:
          BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-cdc0-81fd-8799-abe73ecf65b9/raw?se=2026-11-26T22%3A09%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=8743567b-d5f7-5db8-b0cc-6b00ec88eb24&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T21%3A50%3A42Z&ske=2026-11-27T21%3A50%3A42Z&sks=b&skv=2026-06-06&sig=rCeLRtAF4zW%2BwU/BEyjPg8iuDbwx5zHzSG/64WpBwcw%3D'
        run: |
          set -euo pipefail
          mkdir -p .release-staging
          printf '%s\n' '{"artifact":"Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.47.apk","unsignedBundleSha256":"7768d7c0f76dd39550345246f0ee0e58b3db9036ddb5f2fae0273c8a40909739","unsignedApkSha256":"aafe15156db1eae64196642c69166b1adc3e4262f6da283d4f3963ff8d4621b8","patchSha256":"5d1cfc583097e495eddee8b54a43b89e3e6a84af2b2ecbbfe01107c35628c456","signedApkSha256":"a51a2789354ea73e39b06cc4dfdbd38db28f608b9a5a801cec54b0a2ef5d7474","signedApkSize":7630203,"assets":545,"sourceSha":"2e71e154efd29c7d5748501df229fbac74dde10c","certificate":"48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4","regressionTests":"3561/3561 passed from exact extracted package and independent CI"}' > .release-staging/v347-manifest.json

          M=.release-staging/v347-manifest.json
          case "$BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$BUNDLE_URL" -o /tmp/bundle.zip
          echo "$(jq -r .unsignedBundleSha256 "$M")  /tmp/bundle.zip" | sha256sum -c
          unzip -q /tmp/bundle.zip -d /tmp/yhr332
          find /tmp/yhr332 -type f
          U=$(find /tmp/yhr332 -type f -name '*.apk')
          S=$(find /tmp/yhr332 -type f -name EXACT_SOURCE.txt)
          test -f "$U"
          grep -F '2e71e154efd29c7d5748501df229fbac74dde10c' "$S"
          echo "$(jq -r .unsignedApkSha256 "$M")  $U" | sha256sum -c
          cat .release-staging/v347-signed-delta.b64 | base64 -d > /tmp/delta.zst
          echo "$(jq -r .patchSha256 "$M")  /tmp/delta.zst" | sha256sum -c
          mkdir -p releases
          A="releases/$(jq -r .artifact "$M")"
          zstd --patch-from="$U" -d -q -f /tmp/delta.zst -o "$A"
          echo "$(jq -r .signedApkSha256 "$M")  $A" | sha256sum -c
          test "$(stat -c %s "$A")" = "$(jq -r .signedApkSize "$M")"
          python - "$U" "$A" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is None and b.testzip() is None
              def entries(z):
                  return {i.filename:hashlib.sha256(z.read(i)).hexdigest() for i in z.infolist() if not i.is_dir() and not i.filename.startswith('META-INF/')}
              x,y=entries(a),entries(b)
              assert x==y
              assert len([n for n in y if n.startswith('assets/www/')])==545
              print('Signed/unsigned payload parity and 545 web assets verified')
          PY
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/zipalign" -c -v 4 "$A" > /tmp/align.txt
          "$SDK/aapt" dump badging "$A" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='149' versionName='3.0.47'"
          "$SDK/apksigner" verify --verbose --print-certs "$A" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          grep -F 'Number of signers: 1' /tmp/sign.txt
      - name: Stage draft and verify signed asset, without changing feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M=.release-staging/v347-manifest.json
          A="releases/$(jq -r .artifact "$M")"
          HASH=$(jq -r .signedApkSha256 "$M")
          NAME=$(basename "$A")
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" >/tmp/feed-before.json
          test "$(jq -r .sha /tmp/feed-before.json)" = ae1cf883746d3321865a4346c89313d48c20edb3
          gh release view v3.0.46 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)>0'
          if gh release view v3.0.47 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refuse replacement'; exit 1; fi
          gh release create v3.0.47 "$A" --draft --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.47 — Expanded paired intake' --notes '32 native intake contracts and 18 candidate MCP tools; existing paired review and approval preserved. 3561 mandatory tests passed. Original-key signed APK; v3.0.46 rollback. Worker deployment and hosted registration independently verified before coordinated completion; physical acceptance pending.'
          gh release view v3.0.47 --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url | tee /tmp/release.json
          jq -e '.isDraft==true and (.assets|length)==1' /tmp/release.json
          mkdir -p /tmp/readback
          gh release download v3.0.47 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" >/tmp/feed-after.json
          test "$(jq -r .sha /tmp/feed-after.json)" = ae1cf883746d3321865a4346c89313d48c20edb3
          echo 'EXACT SIGNED DRAFT ASSET VERIFIED; LIVE FEED UNCHANGED'
