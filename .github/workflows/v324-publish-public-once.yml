name: Publish verified v3.0.24
on:
  push:
    branches: [release/v324-public-one-time-20261124]
    paths: [.github/workflows/v324-publish-public-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'release: verified signed v3.0.24 public updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify exact signed APK
        env:
          BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-c77c-81fd-84d9-96b1182e6d6e/raw?se=2026-11-24T21%3A40%3A24Z&sp=r&sv=2026-06-06&sr=b&scid=d6361714-ece4-54ba-982d-c8018d4eb626&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T23%3A58%3A46Z&ske=2026-11-24T23%3A58%3A46Z&sks=b&skv=2026-06-06&sig=Pr7nu85vIeVvLIxwanOw6tSjmWlX0UM4v3XUEPHWIQ0%3D'
        run: |
          set -euo pipefail
          M=.v324-signed-stage/manifest.json
          case "$BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$BUNDLE_URL" -o /tmp/bundle.zip
          echo "$(jq -r .unsignedBundleSha256 "$M")  /tmp/bundle.zip" | sha256sum -c
          unzip -q /tmp/bundle.zip -d /tmp/yhr324
          find /tmp/yhr324 -type f
          U=$(find /tmp/yhr324 -type f -name '*.apk')
          S=$(find /tmp/yhr324 -type f -name EXACT_SOURCE.txt)
          test -f "$U"
          grep -F '187236845d5487c8ddb1d83cee589844c103b1c5' "$S"
          echo "$(jq -r .unsignedApkSha256 "$M")  $U" | sha256sum -c
          base64 -d .v324-signed-stage/signed-delta.b64 > /tmp/delta.zst
          echo "$(jq -r .patchSha256 "$M")  /tmp/delta.zst" | sha256sum -c
          mkdir -p releases
          A="releases/$(jq -r .artifact "$M")"
          zstd --patch-from="$U" -d -q -f /tmp/delta.zst -o "$A"
          echo "$(jq -r .signedApkSha256 "$M")  $A" | sha256sum -c
          test "$(stat -c %s "$A")" = "$(jq -r .signedApkSize "$M")"
          python - "$U" "$A" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is None and b.testzip() is None
              def entries(z):
                  return {i.filename:hashlib.sha256(z.read(i)).hexdigest() for i in z.infolist() if not i.is_dir() and not i.filename.startswith('META-INF/')}
              x,y=entries(a),entries(b)
              assert x==y
              assert len([n for n in y if n.startswith('assets/www/')])==422
              print('Signed/unsigned payload parity and 422 web assets verified')
          PY
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/zipalign" -c -v 4 "$A" > /tmp/align.txt
          "$SDK/aapt" dump badging "$A" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='126' versionName='3.0.24'"
          "$SDK/apksigner" verify --verbose --print-certs "$A" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          grep -F 'Number of signers: 1' /tmp/sign.txt
      - name: Publish and verify release before updating feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M=.v324-signed-stage/manifest.json
          A="releases/$(jq -r .artifact "$M")"
          HASH=$(jq -r .signedApkSha256 "$M")
          NAME=$(basename "$A")
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/old.json
          PREV=$(jq -r .sha /tmp/old.json)
          test "$PREV" = 5fed9264d0547440fd212c0eab8049af54e2ccc2
          jq -r .content /tmp/old.json | base64 -d > /tmp/old-feed.json
          cat /tmp/old-feed.json
          gh release view v3.0.22 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release create v3.0.24 "$A" --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.24 — V2 Ownership and Reliability' --notes 'Consolidated local epoch authority, recovery admission and federal defaults; separated shared repository mechanics, atomic transaction families, and UI business orchestration. Zero circular application imports; historical Order mutation functions isolated from shipping code. Includes unpublished v3.0.23 quota-aware cooldown and diagnostics corrections. All 18 owner identities, database schema, and financial protections preserved. 3201 checks passed, zero failures, five existing skips; 422 web assets verified. Signed with original certificate. Live Worker deployment and physical-device validation remain pending; v3.0.22 retained for rollback.'
          gh release view v3.0.24 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | tee /tmp/release.json
          jq -e '.isDraft==false and .isPrerelease==false' /tmp/release.json
          mkdir -p /tmp/readback
          gh release download v3.0.24 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.24/$NAME"
          curl -fSsL --retry 3 "$URL" -o /tmp/public.apk
          echo "$HASH  /tmp/public.apk" | sha256sum -c
          PUB=$(gh release view v3.0.24 --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          test -n "$PUB"
          jq --arg publishedAt "$PUB" --arg url "$URL" --arg hash "$HASH" --arg source '187236845d5487c8ddb1d83cee589844c103b1c5' '.version="3.0.24" | .versionCode=126 | .apkUrl=$url | .sha256=$hash | .sourceSha=$source | .publishedAt=$publishedAt' /tmp/old-feed.json > /tmp/new-feed.json
          cat /tmp/new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified v3.0.24 update feed' -f branch=main -f sha="$PREV" -f content="$(base64 -w0 /tmp/new-feed.json)" >/tmp/update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" --jq .content | base64 -d > /tmp/api-feed.json
          cmp /tmp/new-feed.json /tmp/api-feed.json
          for i in $(seq 1 36); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/version.json?verify=$(date +%s)" -o /tmp/raw-feed.json && cmp -s /tmp/new-feed.json /tmp/raw-feed.json; then
              echo 'PUBLIC APK AND UPDATE FEED VERIFIED'
              cat /tmp/raw-feed.json
              exit 0
            fi
            sleep 5
          done
          exit 1
