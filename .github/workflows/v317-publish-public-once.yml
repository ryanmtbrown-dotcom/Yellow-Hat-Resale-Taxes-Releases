name: Yellow Hat v3.0.17 signed verified public release (one-time)
on:
  push:
    branches:
      - release/v317-public-one-time-20261124
    paths:
      - .github/workflows/v317-publish-public-once.yml
permissions:
  contents: write
concurrency:
  group: v317-signed-public-once
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'release: verified signed v3.0.17 public updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare signed APK verifier and reconstruct exact signed bytes
        shell: bash
        env:
          UNSIGNED_BUNDLE_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-b920-8212-9af2-0ec6fdc8d66a/raw?se=2026-11-24T04%3A41%3A28Z&sp=r&sv=2026-06-06&sr=b&scid=585bbbdd-5b29-566d-a52d-8ab755baa9bd&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T01%3A55%3A03Z&ske=2026-11-25T01%3A55%3A03Z&sks=b&skv=2026-06-06&sig=vPzSLnCWknRBzXn3bzP13q2TdRtkjbKTP/kU680ujcM%3D'
        run: |
          set -euo pipefail
          SOURCE_SHA='b0c9cfb015463b41b8867baf5932da23f3f1e1f3'
          META='.v317-signed-stage/manifest.json'
          test -s "$META"
          test "$(jq -er .version "$META")" = '3.0.17'
          test "$(jq -er .versionCode "$META")" = '119'
          test "$(jq -er .sourceSha "$META")" = "$SOURCE_SHA"
          test "$(jq -er .sourceBuildRun "$META")" = '45327229085'
          test "$(jq -er .versionCode version.json)" -lt 119
          EXPECT_BUNDLE="$(jq -er .unsignedBundleSha256 "$META")"
          EXPECT_UNSIGNED="$(jq -er .unsignedApkSha256 "$META")"
          EXPECT_PATCH="$(jq -er .patchSha256 "$META")"
          EXPECT_SIGNED="$(jq -er .signedApkSha256 "$META")"
          EXPECT_CERT="$(jq -er .signingCertificateSha256 "$META")"
          test "$EXPECT_CERT" = '48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4'
          test "$EXPECT_SIGNED" = '56ba41defad3f0f1065995e2b47afdf4fa0b59d27d6b47a837f1d4d88280ae73'
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.17.apk'
          test "$(jq -er .artifact "$META")" = "$NAME"
          case "$UNSIGNED_BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) echo 'Unapproved bundle host'; exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$UNSIGNED_BUNDLE_URL" -o /tmp/yhr-v317-unsigned-bundle.zip
          echo "$EXPECT_BUNDLE  /tmp/yhr-v317-unsigned-bundle.zip" | sha256sum --check
          unzip -p /tmp/yhr-v317-unsigned-bundle.zip app-release-unsigned.apk > /tmp/yhr-v317-unsigned.apk
          echo "$EXPECT_UNSIGNED  /tmp/yhr-v317-unsigned.apk" | sha256sum --check
          base64 -d .v317-signed-stage/signed-delta.b64 > /tmp/yhr-v317-signed-delta.zst
          echo "$EXPECT_PATCH  /tmp/yhr-v317-signed-delta.zst" | sha256sum --check
          command -v zstd >/dev/null
          mkdir -p releases
          zstd --patch-from=/tmp/yhr-v317-unsigned.apk -d -q -f /tmp/yhr-v317-signed-delta.zst -o "releases/$NAME"
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          test "$(stat -c '%s' "releases/$NAME")" = "$(jq -er .signedApkSize "$META")"
          unzip -tq "releases/$NAME" >/dev/null
          if [ ! -f "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
            test -n "$sdkmanager_path"
            "$sdkmanager_path" 'build-tools;35.0.0'
          fi
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "releases/$NAME" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "releases/$NAME" > /tmp/yhr-v317-badging.txt
          grep -Eq "package: name='com.yellowhatresale.taxes' versionCode='119' versionName='3.0.17'" /tmp/yhr-v317-badging.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "releases/$NAME" > /tmp/yhr-v317-signature.txt
          grep -Fiq "$EXPECT_CERT" /tmp/yhr-v317-signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/yhr-v317-signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/yhr-v317-signature.txt
          gh --version >/dev/null
          echo 'PASS: v3.0.17 unsigned CI provenance, patch and original-key signed APK validated.'
      - name: Publish signed public release and independently verify before promoting updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.17.apk'
          SOURCE_SHA='b0c9cfb015463b41b8867baf5932da23f3f1e1f3'
          EXPECT_SIGNED='56ba41defad3f0f1065995e2b47afdf4fa0b59d27d6b47a837f1d4d88280ae73'
          echo "$EXPECT_SIGNED  releases/$NAME" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/yhr-prev-feed-api.json
          PREV_BLOB="$(jq -er .sha /tmp/yhr-prev-feed-api.json)"
          test "$PREV_BLOB" = '6f09b64b65ebf6a23daa7c4e1104fc023caad385'
          jq -er .content /tmp/yhr-prev-feed-api.json | base64 -d > /tmp/yhr-prev-feed.json
          test "$(jq -er .version /tmp/yhr-prev-feed.json)" = '3.0.16'
          test "$(jq -er .versionCode /tmp/yhr-prev-feed.json)" = '118'
          test "$(jq -er .sha256 /tmp/yhr-prev-feed.json)" = 'fc3dcb221bbf18fa00566db908d730c1e441f7f557419151ff68dce3724541cb'
          gh release view v3.0.16 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v3.0.15 --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! gh release view v3.0.17 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.0.17 "releases/$NAME" --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.17' --notes "Owner-authorized diagnostic testing release. Original signing key verified. Exact source SHA $SOURCE_SHA. APK SHA-256 $EXPECT_SIGNED. Persistent current synchronization health, independently reported peer status, active-record parity, bounded network requests and responsive retry. Additive diagnostic-only Worker and D1 change; existing business records and pairing preserved. Physical two-phone validation pending. Prior releases retained."
          fi
          test "$(gh release view v3.0.17 --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq '.isPrerelease or .isDraft')" = 'false'
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download v3.0.17 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/readback"
          echo "$EXPECT_SIGNED  $RUNNER_TEMP/readback/$NAME" | sha256sum --check
          echo 'PASS public release asset downloaded and verified before updater promotion'
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.17/$NAME"
          jq -n --arg product 'Yellow Hat Resale Inventory and Taxes' --arg version '3.0.17' --argjson versionCode 119 --arg apkUrl "$APK_URL" --arg sha256 "$EXPECT_SIGNED" --arg sourceSha "$SOURCE_SHA" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{product:$product,version:$version,versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256,sourceSha:$sourceSha,publishedAt:$publishedAt}' > /tmp/yhr-new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified Android v3.0.17 and update feed' -f branch=main -f sha="$PREV_BLOB" -f content="$(base64 -w0 /tmp/yhr-new-feed.json)" > /tmp/yhr-feed-update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" | jq -er .content | base64 -d > /tmp/yhr-live-feed.json
          cmp /tmp/yhr-new-feed.json /tmp/yhr-live-feed.json
          gh release view v3.0.16 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v3.0.15 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo 'PUBLISHED v3.0.17: exact signed public asset and updater feed independently verified; rollback releases retained'
