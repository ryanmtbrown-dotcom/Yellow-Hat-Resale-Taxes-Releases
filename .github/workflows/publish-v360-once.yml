name: Publish verified v3.0.60 signed APK once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v360-once.yml]
concurrency:
  group: yellow-hat-staged-apk-publication
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'Publish owner-authorized verified v3.0.60 APK once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context=exact-v360-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Verify exact authorized release inputs and reconstruct signed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er .version version.json)" = 3.0.59
          test "$(jq -er .versionCode version.json)" = 161
          test "$(jq -er .sha256 version.json)" = 3a96bd2aac17de061a5647d9545685a4156843ed8fc1846efaf595439d7c95be
          test "$(jq -er .version staging-v360/version.json)" = 3.0.60
          test "$(jq -er .versionCode staging-v360/version.json)" = 162
          test "$(jq -er .sourceSha staging-v360/version.json)" = d92343663230773d0818b7fde81f3d5e576d3d6d
          test "$(jq -er .sha256 staging-v360/version.json)" = 6c751fb627867083d2365a0ce4b9c8549e7a27eefc7e67cc536f7ac35b7688d6
          META=staging-v360/release.json
          test "$(jq -er .mode "$META")" = verified_unsigned_bundle_delta_v1
          test "$(jq -er .sha256 "$META")" = 6c751fb627867083d2365a0ce4b9c8549e7a27eefc7e67cc536f7ac35b7688d6
          OUTPUT="$(jq -er .output "$META")"
          test "$OUTPUT" = releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.60.apk
          BUNDLE_URL="$(jq -er .unsignedBundleUrl "$META")"
          case "$BUNDLE_URL" in
            https://*.oaiusercontent.com/files/*) ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 120 "$BUNDLE_URL" -o /tmp/yh-unsigned-artifact.zip
          echo "4bbde3120155676594da258cd71bd5a65a9be4396374841273f5487318673d7b  /tmp/yh-unsigned-artifact.zip" | sha256sum --check -
          unzip -p /tmp/yh-unsigned-artifact.zip app-release-unsigned.apk > /tmp/yh-unsigned.apk
          echo "1829f67a82b31319e6137574689f243dd10ee7575c1386b4e6f70f5d2e9968ff  /tmp/yh-unsigned.apk" | sha256sum --check -
          cat staging-v360/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/yh-signed-delta.zst
          echo "67e5b7cd7d09f56e0a8a5a812ecd67c6a0bf4f64e6e73c97a3aa923c620db750  /tmp/yh-signed-delta.zst" | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from=/tmp/yh-unsigned.apk /tmp/yh-signed-delta.zst -o "$OUTPUT"
          echo "6c751fb627867083d2365a0ce4b9c8549e7a27eefc7e67cc536f7ac35b7688d6  $OUTPUT" | sha256sum --check -
          unzip -tq "$OUTPUT"
      - name: Publish and read back immutable signed APK Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' staging-v360/version.json)"
          CODE="$(jq -er '.versionCode' staging-v360/version.json)"
          PREVIOUS_CODE="$(jq -er '.versionCode' version.json)"
          OUTPUT="$(jq -er '.output' staging-v360/release.json)"
          EXPECTED_SHA="$(jq -er '.sha256' staging-v360/release.json)"
          [ "$CODE" -gt "$PREVIOUS_CODE" ]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NAME="Yellow_Hat_Resale_Inventory_and_Taxes_v${VERSION}.apk"
          TAG="v${VERSION}"
          test "$OUTPUT" = "releases/$NAME"
          test "$(jq -er '.sha256' staging-v360/version.json)" = "$EXPECTED_SHA"
          echo "$EXPECTED_SHA  $OUTPUT" | sha256sum --check -
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG will only be accepted after exact asset SHA-256 readback."
          else
            gh release create "$TAG" "$OUTPUT" \
              --title "Yellow Hat Resale v${VERSION}" \
              --notes "Verified signed Android APK. SHA-256: ${EXPECTED_SHA}. Prior signed release retained as rollback." \
              --target "$GITHUB_SHA"
          fi
          VERIFY_DIR="$RUNNER_TEMP/yellow-hat-asset-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --pattern "$NAME" --dir "$VERIFY_DIR"
          echo "$EXPECTED_SHA  $VERIFY_DIR/$NAME" | sha256sum --check -
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          jq --arg url "$URL" --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.apkUrl = $url | .publishedAt = $time' staging-v360/version.json > "$RUNNER_TEMP/yellow-hat-verified-version.json"

      - name: Publish verified release feed and retain current plus one previous APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(jq -er '.version' version.json)"
          NEW_VERSION="$(jq -er '.version' "$RUNNER_TEMP/yellow-hat-verified-version.json")"
          [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$NEW_VERSION" != "$PREVIOUS_VERSION"
          # Protect the previous signed GitHub Release asset while the new
          # artifact is checked; do not rebuild or re-sign APKs in this job.
          gh release view "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p "$RUNNER_TEMP/rollback-check"
          gh release download v3.0.59 --pattern Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.59.apk --dir "$RUNNER_TEMP/rollback-check"
          echo "3a96bd2aac17de061a5647d9545685a4156843ed8fc1846efaf595439d7c95be  $RUNNER_TEMP/rollback-check/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.59.apk" | sha256sum --check -
          gh release view "v$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          cp "$RUNNER_TEMP/yellow-hat-verified-version.json" version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git rm -r staging-v360
          git rm .github/workflows/publish-v360-once.yml
          git commit -m "Publish verified Android release asset and feed"
          git push
          gh api repos/$GITHUB_REPOSITORY/contents/version.json --jq .content | base64 --decode > "$RUNNER_TEMP/live-version.json"
          cmp version.json "$RUNNER_TEMP/live-version.json"

          # Cleanup happens only after successful signed-APK readback and
          # the new live updater commit. Keep exactly current and previous.
          while IFS= read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            case "$old_tag" in
              "v$NEW_VERSION"|"v$PREVIOUS_VERSION") continue ;;
            esac
            if [[ "$old_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              gh release delete "$old_tag" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq '.[].tagName')
      - name: Record exact publication outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context=exact-v360-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
