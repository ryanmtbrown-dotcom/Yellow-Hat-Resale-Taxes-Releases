name: Yellow Hat v3.0.0 verified signed APK controlled publication
# One-time manually authorized candidate publication: never changes public updater feed.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yhr-v300-prerelease-once.yml
permissions:
  contents: write
jobs:
  publish-controlled-candidate:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'stage: original-key verified v3.0.0 controlled APK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify rollback feed and reconstruct exact signed candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.version' version.json)" = '0.2.99'
          test "$(jq -r '.versionCode' version.json)" = '101'
          test "$(jq -r '.sha256' version.json)" = 'c2081f4f50bc70380affccb1621401b64f576bdce74746f2a4e22d96ca5e0beb'
          test "$(find staging/v300-signed-apk -name 'part_*.b64' -type f | wc -l)" -eq 12
          mkdir -p "$RUNNER_TEMP/v300-asset"
          cat staging/v300-signed-apk/part_*.b64 | base64 --decode > "$RUNNER_TEMP/v300-asset/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.0.apk"
          echo 'dc7d845a759ef4d0a4afed3f2b8bfe792201b29f2e9f0ee113ba91e5edae1d2c  '"$RUNNER_TEMP/v300-asset/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.0.apk" | sha256sum --check --status
          unzip -tqq "$RUNNER_TEMP/v300-asset/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.0.apk"
          test "$(unzip -Z1 "$RUNNER_TEMP/v300-asset/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.0.apk" | grep -c '^assets/www/')" -ge 510
          echo 'Validated original-key signed v3.0.0 candidate bytes; published v0.2.99 updater feed untouched.'
      - name: Publish controlled GitHub pre-release, verify complete asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.0.apk'
          source="$RUNNER_TEMP/v300-asset/$name"
          if ! gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.0.0 "$source" --repo "$GITHUB_REPOSITORY" \
              --target main --prerelease --title 'Yellow Hat Resale v3.0.0 - controlled candidate' \
              --notes 'Original-key signed and verified Android 3.0.0 (versionCode 102). Private source commit f8c4329ef5afb269233b37184cf29ed722124abd. SHA-256 dc7d845a759ef4d0a4afed3f2b8bfe792201b29f2e9f0ee113ba91e5edae1d2c. The public updater feed remains v0.2.99 until physical-device and recovery acceptance. Do not install on Sharon primary V1 device; Ryan-only controlled install and backup verification are pending. The extra fifteen V2 owner domains remain paused.'
          fi
          mkdir -p "$RUNNER_TEMP/v300-readback"
          gh release download v3.0.0 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/v300-readback"
          echo 'dc7d845a759ef4d0a4afed3f2b8bfe792201b29f2e9f0ee113ba91e5edae1d2c  '"$RUNNER_TEMP/v300-readback/$name" | sha256sum --check --status
          test "$(gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = true
          test "$(jq -r '.version' version.json)" = '0.2.99'
          echo 'Public signed APK readback PASS, prerelease=true; live updater still v0.2.99.'
      - name: Remove one-time transport/workflow without touching live updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- staging/v300-signed-apk .github/workflows/yhr-v300-prerelease-once.yml
          git diff --cached --exit-code -- version.json
          git commit -m 'chore: clean v3.0.0 controlled candidate transport'
          git push origin HEAD:main
          test "$(jq -r '.version' version.json)" = '0.2.99'