name: Publish verified v3.0.67 signed APK once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v367-once.yml]
concurrency:
  group: yellow-hat-staged-apk-publication
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'Publish owner-authorized verified v3.0.67 APK once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context=exact-v367-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Verify exact authorized release inputs and reconstruct signed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er .version version.json)" = 3.0.66
          test "$(jq -er .versionCode version.json)" = 168
          test "$(jq -er .sha256 version.json)" = aca211b0cc853d1e9761a2ab20442f12874af7b14ee7c9b94e31a70af19b0f7f
          test "$(jq -er .version staging-v367/version.json)" = 3.0.67
          test "$(jq -er .versionCode staging-v367/version.json)" = 169
          test "$(jq -er .sourceSha staging-v367/version.json)" = 3195ef4c0ebd60725185ba51136e637f1daea13d
          test "$(jq -er .sha256 staging-v367/version.json)" = 22c9eecea1914e94d9ca09a36d9435fdddbbccc4f2d1832deeecf058b661cccb
          META=staging-v367/release.json
          test "$(jq -er .mode "$META")" = verified_unsigned_bundle_delta_v1
          test "$(jq -er .sha256 "$META")" = 22c9eecea1914e94d9ca09a36d9435fdddbbccc4f2d1832deeecf058b661cccb
          OUTPUT="$(jq -er .output "$META")"
          test "$OUTPUT" = releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.67.apk
          BUNDLE_URL="$(jq -er .unsignedBundleUrl "$META")"
          case "$BUNDLE_URL" in
            https://*.oaiusercontent.com/files/*) ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 120 "$BUNDLE_URL" -o /tmp/yh-unsigned-artifact.zip
          echo "4fbdec1567a2a0e1d87bcf21a29ba2003bcd9c0975064e21f6ee44b8db0fd3b6  /tmp/yh-unsigned-artifact.zip" | sha256sum --check -
          unzip -p /tmp/yh-unsigned-artifact.zip app-release-unsigned.apk > /tmp/yh-unsigned.apk
          echo "8ab0c5aaca62cdee973a1de052fdd0103e2ee9169713e68ad425aad8b6cd57f5  /tmp/yh-unsigned.apk" | sha256sum --check -
          cat staging-v367/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/yh-signed-delta.zst
          echo "3f61d4a1d1e0c1989ce290cfe941ca479462d47e7b6b2709906c4b0ebae7bc34  /tmp/yh-signed-delta.zst" | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from=/tmp/yh-unsigned.apk /tmp/yh-signed-delta.zst -o "$OUTPUT"
          echo "22c9eecea1914e94d9ca09a36d9435fdddbbccc4f2d1832deeecf058b661cccb  $OUTPUT" | sha256sum --check -
          unzip -tq "$OUTPUT"
      - name: Check active production Worker compatibility without business writes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://yellow-hat-device-sync.ryan-m-t-brown.workers.dev
          curl --fail --silent --show-error --retry 2 --max-time 20 "$ROOT/api/v2/compatibility" -o /tmp/yh-compat.json
          jq -e '.format == "yellow-hat-sync-compat-v2" and .protocol == "yellow-hat-device-sync-v2" and .syncEnabled == true and .enrollmentEnabled == true' /tmp/yh-compat.json
          STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/yh-unauthorized.json -w '%{http_code}' "$ROOT/api/v2/upgrade-sync/status")"
          test "$STATUS" = 401
          jq -e '.error == "device_not_paired"' /tmp/yh-unauthorized.json
          PLUGIN=https://yellow-hat-resale-plugin-v2.ryan-m-t-brown.workers.dev
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/health" -o /tmp/yh-plugin-health.json
          jq -e '.productionImports == true and (.enabledContracts | length) == 32 and .mode == "paired-intake"' /tmp/yh-plugin-health.json
          STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/yh-plugin-unauthorized.json -w '%{http_code}' "$PLUGIN/api/intake/session")"
          test "$STATUS" = 401
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/imports/plugin-v2/packing-batch-import-contract.js" -o /tmp/yh-packing-contract.js
          echo "2ecd3b39f79a2e66b5ce487c43567e181e17b22fee2aa3f40e07322dab420449  /tmp/yh-packing-contract.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/inventory/card-order-allocation-day.js" -o /tmp/yh-allocation-day.js
          echo "4c83b1c99459dd53c28a0a10af7dbe7275d5ba4e814077205548fee02da29168  /tmp/yh-allocation-day.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/imports/plugin-v2/order-create-contract.js" -o /tmp/yh-order-create.js
          echo "b821f3903de163276a5102142232885165d113513a9226cc381ff268daa3294d  /tmp/yh-order-create.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/order-management/current-order-from-session.js" -o /tmp/yh-order-from-session.js
          echo "617e32bad556bf222b9301b31d9d662cee6557cb9de38cee3346fdd81fa12f9f  /tmp/yh-order-from-session.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/order-management/tcg-packing-slip-domain.js" -o /tmp/yh-packing-parser.js
          echo "19e67f24d976705d91121bdfb8855726589b460c1d5827eb643026a6c00360be  /tmp/yh-packing-parser.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/imports/plugin-v2/packing-recipient-import-contract.js" -o /tmp/yh-packing-recipient.js
          echo "a768d4fe6817ab730e3f5ce11991c10e66448e6b43fd56625a3dff6958976d4a  /tmp/yh-packing-recipient.js" | sha256sum --check -
          curl --fail --silent --show-error --retry 2 --max-time 20 "$PLUGIN/studio/modules/src/app/inventory/card-sales-source.js" -o /tmp/yh-card-sales-source.js
          echo "38ab1c48574a4e1c0daf63e3e7ffe2964e68aa1cb018f3e896cec77eeef6f74b  /tmp/yh-card-sales-source.js" | sha256sum --check -
      - name: Publish and read back immutable signed APK Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' staging-v367/version.json)"
          CODE="$(jq -er '.versionCode' staging-v367/version.json)"
          PREVIOUS_CODE="$(jq -er '.versionCode' version.json)"
          OUTPUT="$(jq -er '.output' staging-v367/release.json)"
          EXPECTED_SHA="$(jq -er '.sha256' staging-v367/release.json)"
          [ "$CODE" -gt "$PREVIOUS_CODE" ]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NAME="Yellow_Hat_Resale_Inventory_and_Taxes_v${VERSION}.apk"
          TAG="v${VERSION}"
          test "$OUTPUT" = "releases/$NAME"
          test "$(jq -er '.sha256' staging-v367/version.json)" = "$EXPECTED_SHA"
          echo "$EXPECTED_SHA  $OUTPUT" | sha256sum --check -
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG will only be accepted after exact asset SHA-256 readback."
          else
            gh release create "$TAG" "$OUTPUT" \
              --title "Yellow Hat Resale v${VERSION}" \
              --notes "Verified signed Android APK. SHA-256: ${EXPECTED_SHA}. Prior signed release retained as rollback." \
              --target "$GITHUB_SHA"
          fi
          VERIFY_DIR="$RUNNER_TEMP/yellow-hat-asset-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --pattern "$NAME" --dir "$VERIFY_DIR"
          echo "$EXPECTED_SHA  $VERIFY_DIR/$NAME" | sha256sum --check -
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          jq --arg url "$URL" --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.apkUrl = $url | .publishedAt = $time' staging-v367/version.json > "$RUNNER_TEMP/yellow-hat-verified-version.json"

      - name: Publish verified release feed and retain current plus one previous APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(jq -er '.version' version.json)"
          NEW_VERSION="$(jq -er '.version' "$RUNNER_TEMP/yellow-hat-verified-version.json")"
          [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$NEW_VERSION" != "$PREVIOUS_VERSION"
          # Protect the previous signed GitHub Release asset while the new
          # artifact is checked; do not rebuild or re-sign APKs in this job.
          gh release view "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p "$RUNNER_TEMP/rollback-check"
          gh release download v3.0.66 --pattern Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.66.apk --dir "$RUNNER_TEMP/rollback-check"
          echo "aca211b0cc853d1e9761a2ab20442f12874af7b14ee7c9b94e31a70af19b0f7f  $RUNNER_TEMP/rollback-check/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.66.apk" | sha256sum --check -
          gh release view "v$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          cp "$RUNNER_TEMP/yellow-hat-verified-version.json" version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git rm -r staging-v367
          git rm .github/workflows/publish-v367-once.yml
          git commit -m "Publish verified Android release asset and feed"
          git push
          gh api repos/$GITHUB_REPOSITORY/contents/version.json --jq .content | base64 --decode > "$RUNNER_TEMP/live-version.json"
          cmp version.json "$RUNNER_TEMP/live-version.json"

          # Cleanup happens only after successful signed-APK readback and
          # the new live updater commit. Keep exactly current and previous.
          while IFS= read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            case "$old_tag" in
              "v$NEW_VERSION"|"v$PREVIOUS_VERSION") continue ;;
            esac
            if [[ "$old_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              gh release delete "$old_tag" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq '.[].tagName')
      - name: Record exact publication outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context=exact-v367-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
