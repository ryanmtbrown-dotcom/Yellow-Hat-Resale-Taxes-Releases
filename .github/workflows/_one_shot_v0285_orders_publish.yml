name: Publish original-key signed v0.2.85 Orders release (one shot)
# Owner-authorized version-locked publisher; source runner does not hold signing credentials.
# Do not run except on the explicit workflow-creation commit below.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_one_shot_v0285_orders_publish.yml
permissions:
  contents: write
concurrency:
  group: yellow-hat-signed-apk-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish verified signed v0.2.85 Orders release'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently reconstruct and verify exact original-key signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META=staging/release.json
          MANIFEST=staging/version.json
          test -s "$META"; test -s "$MANIFEST"
          test "$(jq -er '.mode' "$META")" = apk_zstd_patch_v1
          test "$(jq -er '.version' "$MANIFEST")" = 0.2.85
          test "$(jq -er '.versionCode' "$MANIFEST")" = 87
          test "$(jq -er '.sha256' "$MANIFEST")" = "$(jq -er '.sha256' "$META")"
          prev="$(jq -er '.versionCode' version.json)"
          test 87 -gt "$prev"
          OUTPUT="$(jq -er '.output' "$META")"
          test "$OUTPUT" = releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.85.apk
          BASE=releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.84.apk
          test "$(jq -er '.base' "$META")" = "$BASE"
          mkdir -p releases
          gh release download v0.2.84 --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$BASE")" --dir releases
          echo "$(jq -er '.baseSha256' "$META")  $BASE" | sha256sum -c -
          command -v zstd
          cat staging/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/yh-v0285-signed-delta.zst
          echo "$(jq -er '.patchSha256' "$META")  /tmp/yh-v0285-signed-delta.zst" | sha256sum -c -
          zstd -q -d -f --patch-from="$BASE" /tmp/yh-v0285-signed-delta.zst -o "$OUTPUT"
          echo "$(jq -er '.sha256' "$META")  $OUTPUT" | sha256sum -c -
          unzip -tqq "$OUTPUT"
      - name: Publish asset, verify release download, then advance feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.85
          OUTPUT=releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.85.apk
          NAME="$(basename "$OUTPUT")"
          HASH="$(jq -er '.sha256' staging/release.json)"
          PREVIOUS="$(jq -er '.version' version.json)"
          test "$PREVIOUS" = 0.2.84
          gh release view "v$PREVIOUS" --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$OUTPUT" --repo "$GITHUB_REPOSITORY" \
              --title "Yellow Hat Resale v0.2.85" \
              --notes "Signed Android update: phone-first Edit Order, daily filters and surname sort, append-only physical returns. SHA-256: $HASH. Previous v0.2.84 retained." --target "$GITHUB_SHA"
          fi
          mkdir -p /tmp/yh-v0285-published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/yh-v0285-published
          echo "$HASH  /tmp/yh-v0285-published/$NAME" | sha256sum -c -
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$NAME"
          jq --arg url "$URL" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.apkUrl=$url | .publishedAt=$at' staging/version.json > version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git rm -r staging
          git rm .github/workflows/_one_shot_v0285_orders_publish.yml
          git commit -m 'Publish v0.2.85 signed APK and verified update feed; remove one-shot publisher'
          git push
          RAW="$(gh api "repos/$GITHUB_REPOSITORY/contents/version.json" --jq .content | base64 --decode)"
          test "$(printf '%s' "$RAW" | jq -er '.version')" = 0.2.85
          test "$(printf '%s' "$RAW" | jq -er '.versionCode')" = 87
          test "$(printf '%s' "$RAW" | jq -er '.sha256')" = "$HASH"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view "v$PREVIOUS" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "PUBLISHED v0.2.85/code87 with signed APK SHA256: $HASH; v$PREVIOUS retained"
