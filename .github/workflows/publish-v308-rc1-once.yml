name: Publish Yellow Hat v3.0.8 RC1 original-key signed prerelease (one-time)
# Prerelease only. NEVER update main/version.json from this workflow.
on:
  push:
    branches:
      - release/v308-rc1-publish-once-20261122
    paths:
      - .github/workflows/publish-v308-rc1-once.yml
permissions:
  contents: write
concurrency:
  group: yellow-hat-v308-rc1-publication-once
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'ci: publish original-key signed Yellow Hat v3.0.8 RC1 prerelease'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      APP: Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.8-rc.1.apk
      SOURCE: Yellow_Hat_Resale_Taxes_v3.0.8_Project.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify stable baseline and immutable prerelease source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r '.version' version.json)" = '3.0.7'
          test "$(jq -r '.versionCode' version.json)" = '109'
          test "$(jq -r '.sha256' version.json)" = 'd5c4057234e4037c79420099981ce1833689d7e52bfa3058135bc3fda72b7fe4'
          test "$(jq -r '.mode' staging/v308-rc1/release.json)" = 'signed_apk_delta_prerelease_v1'
          test "$(jq -r '.version' staging/v308-rc1/release.json)" = '3.0.8'
          test "$(jq -r '.code' staging/v308-rc1/release.json)" = '110'
          gh release view v3.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null
          ! gh release view v3.0.8-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - name: Reconstruct exact signed APK and complete V2 source archive from verified unsigned build
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_URL="$(jq -er '.unsignedBundleUrl' staging/v308-rc1/release.json)"
          case "$BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) echo 'Unsupported artifact source host' >&2; exit 1;; esac
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 "$BUNDLE_URL" -o "$RUNNER_TEMP/verified-unsigned-bundle.zip"
          jq -r '.unsignedBundleSha256' staging/v308-rc1/release.json | awk -v f="$RUNNER_TEMP/verified-unsigned-bundle.zip" '{print $0"  "f}' | sha256sum --check -
          unzip -p "$RUNNER_TEMP/verified-unsigned-bundle.zip" app-release-unsigned.apk > "$RUNNER_TEMP/v308-unsigned.apk"
          jq -r '.unsignedApkSha256' staging/v308-rc1/release.json | awk -v f="$RUNNER_TEMP/v308-unsigned.apk" '{print $0"  "f}' | sha256sum --check -
          cat staging/v308-rc1/chunks/*.b64 | base64 --decode > "$RUNNER_TEMP/signed-delta.zst"
          jq -r '.patchSha256' staging/v308-rc1/release.json | awk -v f="$RUNNER_TEMP/signed-delta.zst" '{print $0"  "f}' | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from="$RUNNER_TEMP/v308-unsigned.apk" "$RUNNER_TEMP/signed-delta.zst" -o "releases/$APP"
          jq -r '.signedApkSha256' staging/v308-rc1/release.json | awk -v f="releases/$APP" '{print $0"  "f}' | sha256sum --check -
          unzip -tq "releases/$APP" >/dev/null
          unzip -p "$RUNNER_TEMP/verified-unsigned-bundle.zip" signing-tools/apksigner.jar > "$RUNNER_TEMP/apksigner.jar"
          java -jar "$RUNNER_TEMP/apksigner.jar" verify --verbose --print-certs "releases/$APP" > "$RUNNER_TEMP/signature-info.txt"
          grep -qi '48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' "$RUNNER_TEMP/signature-info.txt"
          unzip -p "$RUNNER_TEMP/verified-unsigned-bundle.zip" "$SOURCE" > "releases/$SOURCE"
          jq -r '.sourceZipSha256' staging/v308-rc1/release.json | awk -v f="releases/$SOURCE" '{print $0"  "f}' | sha256sum --check -
          unzip -tq "releases/$SOURCE" >/dev/null
          test "$(unzip -p "releases/$SOURCE" 'v308rc1-source/package.json' | jq -r '.version')" = '3.0.8'
          test "$(unzip -p "releases/$SOURCE" '*/android/app/build.gradle' | grep -c 'versionCode 110')" = '1'
      - name: Publish GitHub prerelease and independently read back both assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create v3.0.8-rc.1 "releases/$APP" "releases/$SOURCE" --repo "$GITHUB_REPOSITORY" --target main --prerelease \
            --title 'Yellow Hat Resale v3.0.8 RC1 — V2-only prerelease' --notes-file staging/v308-rc1/RELEASE_NOTES.md
          test "$(gh release view v3.0.8-rc.1 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = true
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download v3.0.8-rc.1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/readback"
          jq -r '.signedApkSha256' staging/v308-rc1/release.json | awk -v f="$RUNNER_TEMP/readback/$APP" '{print $0"  "f}' | sha256sum --check -
          jq -r '.sourceZipSha256' staging/v308-rc1/release.json | awk -v f="$RUNNER_TEMP/readback/$SOURCE" '{print $0"  "f}' | sha256sum --check -
          test "$(jq -r '.version' version.json)" = '3.0.7'
          test "$(jq -r '.versionCode' version.json)" = '109'
          gh release view v3.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo 'Verified V2 prerelease and complete source ZIP. Stable v3.0.7 preserved.'
