name: Publish verified v3.0.61 signed APK once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v361-once.yml]
concurrency:
  group: yellow-hat-staged-apk-publication
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'Publish owner-authorized verified v3.0.61 APK once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context=exact-v361-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Verify exact authorized release inputs and reconstruct signed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er .version version.json)" = 3.0.60
          test "$(jq -er .versionCode version.json)" = 162
          test "$(jq -er .sha256 version.json)" = 6c751fb627867083d2365a0ce4b9c8549e7a27eefc7e67cc536f7ac35b7688d6
          test "$(jq -er .version staging-v361/version.json)" = 3.0.61
          test "$(jq -er .versionCode staging-v361/version.json)" = 163
          test "$(jq -er .sourceSha staging-v361/version.json)" = 3fa6f759f499da9a436e8327d1f91cbbbcfb861b
          test "$(jq -er .sha256 staging-v361/version.json)" = ae7613fc7277b8b768f6ebe1689e7510764660cf07265e24c9d6ef2006e06473
          META=staging-v361/release.json
          test "$(jq -er .mode "$META")" = verified_unsigned_bundle_delta_v1
          test "$(jq -er .sha256 "$META")" = ae7613fc7277b8b768f6ebe1689e7510764660cf07265e24c9d6ef2006e06473
          OUTPUT="$(jq -er .output "$META")"
          test "$OUTPUT" = releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.61.apk
          BUNDLE_URL="$(jq -er .unsignedBundleUrl "$META")"
          case "$BUNDLE_URL" in
            https://*.oaiusercontent.com/files/*) ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 120 "$BUNDLE_URL" -o /tmp/yh-unsigned-artifact.zip
          echo "ddf446aa943be0d90190d7a4d64d8f1f8f02ca1739bced7566318ff7f5797bcc  /tmp/yh-unsigned-artifact.zip" | sha256sum --check -
          unzip -p /tmp/yh-unsigned-artifact.zip app-release-unsigned.apk > /tmp/yh-unsigned.apk
          echo "67f4436d0ad083bea4b73bf0a9195608684fa8dd103b03294effd5c76fcaa8ae  /tmp/yh-unsigned.apk" | sha256sum --check -
          cat staging-v361/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/yh-signed-delta.zst
          echo "fa031c57cf8e75a447d8619822bcb670fc43f18ad8de00c689c60b0bcf463a27  /tmp/yh-signed-delta.zst" | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from=/tmp/yh-unsigned.apk /tmp/yh-signed-delta.zst -o "$OUTPUT"
          echo "ae7613fc7277b8b768f6ebe1689e7510764660cf07265e24c9d6ef2006e06473  $OUTPUT" | sha256sum --check -
          unzip -tq "$OUTPUT"
      - name: Publish and read back immutable signed APK Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' staging-v361/version.json)"
          CODE="$(jq -er '.versionCode' staging-v361/version.json)"
          PREVIOUS_CODE="$(jq -er '.versionCode' version.json)"
          OUTPUT="$(jq -er '.output' staging-v361/release.json)"
          EXPECTED_SHA="$(jq -er '.sha256' staging-v361/release.json)"
          [ "$CODE" -gt "$PREVIOUS_CODE" ]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NAME="Yellow_Hat_Resale_Inventory_and_Taxes_v${VERSION}.apk"
          TAG="v${VERSION}"
          test "$OUTPUT" = "releases/$NAME"
          test "$(jq -er '.sha256' staging-v361/version.json)" = "$EXPECTED_SHA"
          echo "$EXPECTED_SHA  $OUTPUT" | sha256sum --check -
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG will only be accepted after exact asset SHA-256 readback."
          else
            gh release create "$TAG" "$OUTPUT" \
              --title "Yellow Hat Resale v${VERSION}" \
              --notes "Verified signed Android APK. SHA-256: ${EXPECTED_SHA}. Prior signed release retained as rollback." \
              --target "$GITHUB_SHA"
          fi
          VERIFY_DIR="$RUNNER_TEMP/yellow-hat-asset-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --pattern "$NAME" --dir "$VERIFY_DIR"
          echo "$EXPECTED_SHA  $VERIFY_DIR/$NAME" | sha256sum --check -
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          jq --arg url "$URL" --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.apkUrl = $url | .publishedAt = $time' staging-v361/version.json > "$RUNNER_TEMP/yellow-hat-verified-version.json"

      - name: Publish verified release feed and retain current plus one previous APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(jq -er '.version' version.json)"
          NEW_VERSION="$(jq -er '.version' "$RUNNER_TEMP/yellow-hat-verified-version.json")"
          [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$NEW_VERSION" != "$PREVIOUS_VERSION"
          # Protect the previous signed GitHub Release asset while the new
          # artifact is checked; do not rebuild or re-sign APKs in this job.
          gh release view "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p "$RUNNER_TEMP/rollback-check"
          gh release download v3.0.60 --pattern Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.60.apk --dir "$RUNNER_TEMP/rollback-check"
          echo "6c751fb627867083d2365a0ce4b9c8549e7a27eefc7e67cc536f7ac35b7688d6  $RUNNER_TEMP/rollback-check/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.60.apk" | sha256sum --check -
          gh release view "v$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          cp "$RUNNER_TEMP/yellow-hat-verified-version.json" version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git rm -r staging-v361
          git rm .github/workflows/publish-v361-once.yml
          git commit -m "Publish verified Android release asset and feed"
          git push
          gh api repos/$GITHUB_REPOSITORY/contents/version.json --jq .content | base64 --decode > "$RUNNER_TEMP/live-version.json"
          cmp version.json "$RUNNER_TEMP/live-version.json"

          # Cleanup happens only after successful signed-APK readback and
          # the new live updater commit. Keep exactly current and previous.
          while IFS= read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            case "$old_tag" in
              "v$NEW_VERSION"|"v$PREVIOUS_VERSION") continue ;;
            esac
            if [[ "$old_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              gh release delete "$old_tag" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release list --limit 100 --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq '.[].tagName')
      - name: Record exact publication outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context=exact-v361-publish -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
