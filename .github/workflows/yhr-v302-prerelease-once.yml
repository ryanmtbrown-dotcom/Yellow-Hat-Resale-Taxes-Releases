name: Yellow Hat v3.0.2 original-key verified controlled prerelease publication
# A single explicit owner-approved pilot APK; do not change production version.json.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yhr-v302-prerelease-once.yml
permissions:
  contents: write
jobs:
  publish-controlled-candidate:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'stage: original-key verified v3.0.2 controlled APK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify unchanged production feed and exact previous original-key signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -r '.version' version.json)" = '0.2.99'
          test "$(jq -r '.versionCode' version.json)" = '101'
          test "$(jq -r '.sha256' version.json)" = 'c2081f4f50bc70380affccb1621401b64f576bdce74746f2a4e22d96ca5e0beb'
          mkdir -p "$RUNNER_TEMP/yhr-v302-base" "$RUNNER_TEMP/yhr-v302-candidate"
          gh release download v3.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.1.apk' --dir "$RUNNER_TEMP/yhr-v302-base"
          echo 'f677da9b336194af48b2ed4663d5d6ff3fe4614414d1c23d0a701c986d375ebf  '"$RUNNER_TEMP/yhr-v302-base/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.1.apk" | sha256sum --check --status
          test "$(find staging/v302-signed-patch -name 'part_*.b64' -type f | wc -l)" -eq 13
          cat staging/v302-signed-patch/part_*.b64 | base64 --decode > "$RUNNER_TEMP/yhr-v302-candidate/signed-patch.zst"
          echo '2edc56315280b94f39943eddf3fde7bbb455f72ef0e2cdbf6755f57d8c8e4f20  '"$RUNNER_TEMP/yhr-v302-candidate/signed-patch.zst" | sha256sum --check --status
          zstd -q -d -f \
            --patch-from="$RUNNER_TEMP/yhr-v302-base/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.1.apk" \
            "$RUNNER_TEMP/yhr-v302-candidate/signed-patch.zst" \
            -o "$RUNNER_TEMP/yhr-v302-candidate/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.2.apk"
          echo '6a61814a0945a94bcf04da0564c6e41f11940fd5f9fd6a03b97f5904dcfa91c2  '"$RUNNER_TEMP/yhr-v302-candidate/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.2.apk" | sha256sum --check --status
          unzip -tqq "$RUNNER_TEMP/yhr-v302-candidate/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.2.apk"
          test "$(unzip -Z1 "$RUNNER_TEMP/yhr-v302-candidate/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.2.apk" | grep -c '^assets/www/')" -ge 513
          echo 'Verified exact signed APK from original-key candidate; production feed unchanged.'
      - name: Publish pilot prerelease and independently download exact signed asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.2.apk'
          source="$RUNNER_TEMP/yhr-v302-candidate/$name"
          if ! gh release view v3.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.0.2 "$source" --repo "$GITHUB_REPOSITORY" \
              --target main --prerelease --title 'Yellow Hat Resale v3.0.2 - controlled Android pilot' \
              --notes 'Controlled pilot prerelease. Android code 104, exact private source commit 0b2091cb9d60fe4bc29efbff55772b419a186691. Original signing certificate SHA-256: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4. Signed APK SHA-256: 6a61814a0945a94bcf04da0564c6e41f11940fd5f9fd6a03b97f5904dcfa91c2. Adds once-daily sequential five-second-spaced ParcelsApp rendered-HTML scans of unshipped orders, guarded missed-Shipped correction, one persistent MUNBYN/PDF menu option toggled by long press, and Print All tap-MUNBYN/long-press-PDF. No ParcelsApp API is used. Saved HTML samples passed parser tests; fresh live HTML retrieval on Android, shipping update, and printing gestures need physical pilot testing after installation. Known limitation: network or webpage changes may prevent scans; do not claim automatic shipped detection verified yet. Fifteen additional V2 domains remain paused. The public production updater feed remains v0.2.99, do not install on a non-pilot primary device.'
          fi
          mkdir -p "$RUNNER_TEMP/yhr-v302-readback"
          gh release download v3.0.2 --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/yhr-v302-readback"
          echo '6a61814a0945a94bcf04da0564c6e41f11940fd5f9fd6a03b97f5904dcfa91c2  '"$RUNNER_TEMP/yhr-v302-readback/$name" | sha256sum --check --status
          test "$(gh release view v3.0.2 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = true
          test "$(jq -r '.version' version.json)" = '0.2.99'
          echo 'Exact signed APK published/read back; production updater unchanged.'
      - name: Remove temporary transport and one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- staging/v302-signed-patch .github/workflows/yhr-v302-prerelease-once.yml
          git diff --cached --exit-code -- version.json
          git commit -m 'chore: clean v3.0.2 controlled candidate transport'
          git push origin HEAD:main
          test "$(jq -r '.version' version.json)" = '0.2.99'
