name: One-time approved Yellow Hat v0.2.63 publisher
# Temporary one-use publisher. Owner expressly authorized this release on 2026-11-09.
# This workflow removes itself after a successful, signed-byte-verified publication.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v0263-once.yml'
      - 'staging/release.json'

permissions:
  contents: write

concurrency:
  group: yellow-hat-v0263-owner-approved-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check staged release contract and immutable rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -er '.version' version.json)" = '0.2.61'
          test "$(jq -er '.versionCode' version.json)" = '63'
          test "$(jq -er '.version' staging/version.json)" = '0.2.63'
          test "$(jq -er '.versionCode' staging/version.json)" = '65'
          test "$(jq -er '.version' staging/release.json)" = '0.2.63'
          test "$(jq -er '.versionCode' staging/release.json)" = '65'
          test "$(jq -er '.mode' staging/release.json)" = 'apk_zstd_patch_v1'
          test "$(jq -er '.sourceSha' staging/release.json)" = '33d1d2f6cea22580a3a9683852bdba8c08be6394'
          test "$(jq -er '.sha256' staging/version.json)" = "$(jq -er '.sha256' staging/release.json)"
          test "$(jq -er '.baseSha256' staging/release.json)" = "$(jq -er '.sha256' version.json)"
          test "$(jq -er '.sizeBytes' staging/release.json)" = 4795882
          gh release view v0.2.61 --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view v0.2.63 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A v0.2.63 release already exists. Refusing unreviewed overwrite.' >&2
            exit 1
          fi
      - name: Reconstruct exact signed APK and independently verify signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META=staging/release.json
          BASE="$(jq -er '.base' "$META")"
          OUTPUT="$(jq -er '.output' "$META")"
          test "$BASE" = 'releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.61.apk'
          test "$OUTPUT" = 'releases/Yellow_Hat_Resale_Inventory_and_Taxes_v0.2.63.apk'
          mkdir -p releases
          gh release download v0.2.61 --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$BASE")" --dir releases
          echo "$(jq -er '.baseSha256' "$META")  $BASE" | sha256sum --check -
          command -v zstd >/dev/null
          base64 --decode staging/chunks/000.b64 >/tmp/yellow-hat-v0263.patch.zst
          echo "$(jq -er '.patchSha256' "$META")  /tmp/yellow-hat-v0263.patch.zst" | sha256sum --check -
          zstd -q -d -f --patch-from="$BASE" /tmp/yellow-hat-v0263.patch.zst -o "$OUTPUT"
          echo "$(jq -er '.sha256' "$META")  $OUTPUT" | sha256sum --check -
          test "$(stat -c %s "$OUTPUT")" = "$(jq -er '.sizeBytes' "$META")"
          python3 - "$OUTPUT" <<'PY'
          from pathlib import Path
          import sys,zipfile,struct
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.namelist())==302
              manifest=z.read('AndroidManifest.xml')
              assert struct.unpack_from('<I',manifest,4652+16)[0]==65
              assert manifest.count('0.2.63'.encode('utf-16le'))==1
              meta=z.read('assets/www/src/config/app-metadata.js')
              assert b"version: '0.2.63'" in meta
              assert 'assets/www/src/app/order-management/pull-printing-allocations.js' in z.namelist()
          PY
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
          test -n "$SIGNER" && test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$OUTPUT" > "$RUNNER_TEMP/signer.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signer.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signer.txt"
          grep -Fi "$(jq -er '.certificateSha256' "$META")" "$RUNNER_TEMP/signer.txt"
      - name: Publish, read back and verify exact Release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED="$(jq -er '.sha256' staging/release.json)"
          OUTPUT="$(jq -er '.output' staging/release.json)"
          gh release create v0.2.63 "$OUTPUT" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Yellow Hat Resale v0.2.63' \
            --notes "Signed, verified Android update for List printing allocations, existing-order preservation and packing-slip import correction. Source commit: 33d1d2f6cea22580a3a9683852bdba8c08be6394. Signed APK SHA-256: $EXPECTED. Previous v0.2.61 retained for rollback."
          mkdir -p "$RUNNER_TEMP/yh-v0263-readback"
          gh release download v0.2.63 --repo "$GITHUB_REPOSITORY" \
            --pattern "$(basename "$OUTPUT")" --dir "$RUNNER_TEMP/yh-v0263-readback"
          echo "$EXPECTED  $RUNNER_TEMP/yh-v0263-readback/$(basename "$OUTPUT")" | sha256sum --check -
          gh release view v0.2.61 --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Promote updater feed and remove one-time publisher and staged bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.version' version.json)" = '0.2.61'
          jq --arg stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.publishedAt = $stamp' \
            staging/version.json > "$RUNNER_TEMP/version-verified.json"
          mv "$RUNNER_TEMP/version-verified.json" version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git rm -r staging .github/workflows/publish-approved-v0263-once.yml
          git commit -m 'Publish signed v0.2.63, update verified feed and remove single-use publisher'
          git push origin HEAD:main
