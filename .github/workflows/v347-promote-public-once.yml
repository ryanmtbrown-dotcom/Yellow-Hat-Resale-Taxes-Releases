name: Promote verified v3.0.47 signed draft
on:
  push:
    branches: [release/v347-public-one-time-20261126]
    paths: [.github/workflows/v347-promote-public-once.yml]
permissions:
  contents: write
jobs:
  promote:
    if: >-
      github.event.head_commit.message == 'release: promote verified v3.0.47 signed draft and updater (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify staged signed APK, promote release and publish verified updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME=Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.47.apk
          HASH=a51a2789354ea73e39b06cc4dfdbd38db28f608b9a5a801cec54b0a2ef5d7474
          SOURCE=2e71e154efd29c7d5748501df229fbac74dde10c
          PREV=ae1cf883746d3321865a4346c89313d48c20edb3
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" > /tmp/old.json
          test "$(jq -r .sha /tmp/old.json)" = "$PREV"
          jq -r .content /tmp/old.json | base64 -d > /tmp/old-feed.json
          jq -e '.version=="3.0.46" and .versionCode==148 and .sha256=="0ea77c0e413e0b82b26075197def9a208c1e19cf95d858813b0d3fd86c99fe58"' /tmp/old-feed.json
          gh release view v3.0.46 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)>0'
          gh api "repos/$GITHUB_REPOSITORY/releases/459945704" > /tmp/draft.json
          jq -e --arg h "sha256:$HASH" --arg n "$NAME" '.draft==true and .tag_name=="v3.0.47" and (.assets|length)==1 and .assets[0].id==797883748 and .assets[0].name==$n and .assets[0].digest==$h and .assets[0].size==7630203' /tmp/draft.json
          mkdir -p /tmp/staged /tmp/readback
          gh release download v3.0.47 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/staged
          echo "$HASH  /tmp/staged/$NAME" | sha256sum -c
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/apksigner" verify --verbose --print-certs "/tmp/staged/$NAME" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          "$SDK/aapt" dump badging "/tmp/staged/$NAME" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='149' versionName='3.0.47'"
          gh release edit v3.0.47 --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY" --notes 'Expanded reviewed intake, 32 native contracts, 18 upstream conversational tools; existing 27-contract client negotiation retained. 3561 mandatory tests passed. Exact original-key signed APK. Cloudflare expanded Worker deployed and verified through existing ChatGPT plugin. Hosted registration of eight additional tools remains pending. Preserve v3.0.46 rollback. Physical phone, carrier and printer acceptance pending.'
          gh release view v3.0.47 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,publishedAt | tee /tmp/release.json
          jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)==1' /tmp/release.json
          gh release download v3.0.47 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v3.0.47/$NAME"
          curl -fSsL --retry 3 --connect-timeout 15 --max-time 150 "$URL" -o /tmp/public.apk
          echo "$HASH  /tmp/public.apk" | sha256sum -c
          PUB=$(jq -r .publishedAt /tmp/release.json)
          test -n "$PUB"
          jq --arg publishedAt "$PUB" --arg url "$URL" --arg hash "$HASH" --arg source "$SOURCE" '.version="3.0.47" | .versionCode=149 | .apkUrl=$url | .sha256=$hash | .sourceSha=$source | .publishedAt=$publishedAt' /tmp/old-feed.json > /tmp/new-feed.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/version.json" -f message='Publish verified v3.0.47 update feed' -f branch=main -f sha="$PREV" -f content="$(base64 -w0 /tmp/new-feed.json)" >/tmp/update.json
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" --jq .content | base64 -d > /tmp/api-feed.json
          cmp /tmp/new-feed.json /tmp/api-feed.json
          for i in $(seq 1 36); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/version.json?verify=$(date +%s)" -o /tmp/raw-feed.json && cmp -s /tmp/new-feed.json /tmp/raw-feed.json; then
              echo 'PUBLIC APK AND UPDATE FEED VERIFIED'
              cat /tmp/raw-feed.json
              exit 0
            fi
            sleep 5
          done
          exit 1
