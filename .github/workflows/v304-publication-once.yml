name: Yellow Hat v3.0.4 verified signed APK publication (one-time)
# Trigger only by the explicit exact signed-APK staging commit; never by ordinary updates.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v304-publication-once.yml
permissions:
  contents: write
concurrency:
  group: yellow-hat-staged-apk-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ryanmtbrown-dotcom/Yellow-Hat-Resale-Taxes-Releases' &&
      github.event.head_commit.message == 'ci: publish exact verified Yellow Hat v3.0.4 signed APK'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate current public release, new signed release, and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -er '.version' version.json)" = '3.0.3'
          test "$(jq -er '.versionCode' version.json)" = 105
          test "$(jq -er '.sha256' version.json)" = 'e83e4892d512969853115244aad853f8cb472d1225c093f4a1a22a795044cb54'
          test "$(jq -er '.version' staging/version.json)" = '3.0.4'
          test "$(jq -er '.versionCode' staging/version.json)" = 106
          test "$(jq -er '.sourceSha' staging/version.json)" = 'cbbb87ee1569fe3374ff18858c3aee876aa32a04'
          test "$(jq -er '.mode' staging/release.json)" = 'verified_unsigned_bundle_delta_v1'
          test "$(jq -er '.output' staging/release.json)" = 'releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk'
          test "$(jq -er '.sha256' staging/release.json)" = "$(jq -er '.sha256' staging/version.json)"
          case "$(jq -er '.unsignedBundleUrl' staging/release.json)" in
            https://*.oaiusercontent.com/files/*) ;;
            *) echo 'Not an approved expiring unsigned artifact URL' >&2; exit 1 ;;
          esac
          test "$(find staging/chunks -name '*.b64' -type f | wc -l)" -gt 0
          test ! -e staging/private-key.jks
      - name: Reconstruct ONLY exact verified signed bytes from exact CI unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          export META=staging/release.json
          URL="$(jq -er '.unsignedBundleUrl' "$META")"
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 15 --max-time 240 "$URL" -o /tmp/v304-unsigned-ci-artifact.zip
          echo "$(jq -er '.unsignedBundleSha256' "$META")  /tmp/v304-unsigned-ci-artifact.zip" | sha256sum --check -
          test "$(unzip -Z1 /tmp/v304-unsigned-ci-artifact.zip | grep -cFx 'app-release-unsigned.apk')" = 1
          unzip -p /tmp/v304-unsigned-ci-artifact.zip app-release-unsigned.apk > /tmp/v304-unsigned.apk
          echo "$(jq -er '.unsignedApkSha256' "$META")  /tmp/v304-unsigned.apk" | sha256sum --check -
          command -v zstd
          cat staging/chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/v304-signed-delta.zst
          echo "$(jq -er '.patchSha256' "$META")  /tmp/v304-signed-delta.zst" | sha256sum --check -
          mkdir -p releases
          zstd -q -d -f --patch-from=/tmp/v304-unsigned.apk /tmp/v304-signed-delta.zst -o releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk
          echo "$(jq -er '.sha256' "$META")  releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk" | sha256sum --check -
          unzip -tq releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk >/dev/null
      - name: Independently verify original Android release signer and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk
          SDK="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -name "[0-9]*" | sort -V | tail -n 1)"
          test -n "$SDK"
          test -f "$SDK/lib/apksigner.jar"
          java -jar "$SDK/lib/apksigner.jar" verify --verbose --print-certs "$APK" > /tmp/verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/verification.txt
          grep -Fiq '48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/verification.txt
          "$SDK/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -Eq "package: name='com.yellowhatresale.taxes' versionCode='106' versionName='3.0.4'" /tmp/badging.txt
          unzip -p "$APK" assets/www/src/app/sync/emergency-v2-release-gate.js | grep -Fq 'EMERGENCY_ADDITIONAL_V2_PAUSED=false'
          unzip -p "$APK" assets/www/src/app/sync/device-sync-config.js | grep -Fq 'https://yellow-hat-device-sync.ryan-m-t-brown.workers.dev'
      - name: Publish SHA-verified immutable v3.0.4 signed APK, never overwrite prior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=releases/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk
          EXPECTED="$(jq -er '.sha256' staging/release.json)"
          gh release view v3.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view v3.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v3.0.4 asset tag already exists, refuse overwrite without independent inspection' >&2
            exit 1
          fi
          gh release create v3.0.4 "$APK" \
            --title 'Yellow Hat Resale v3.0.4' \
            --notes "Verified original-signer regular Android update, with owner-by-owner authenticated V2 current-state activation; existing Orders, Pull Lists and Inventory retained. SHA-256: $EXPECTED" \
            --target "$GITHUB_SHA"
          mkdir -p /tmp/verify-v304-release
          gh release download v3.0.4 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk' \
            --dir /tmp/verify-v304-release
          echo "$EXPECTED  /tmp/verify-v304-release/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk" | sha256sum --check -
      - name: Update live version feed ONLY AFTER signed asset readback and remove one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v3.0.4/Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.4.apk"
          gh release view v3.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view v3.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null
          jq --arg url "$URL" '.apkUrl=$url' staging/version.json > version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git rm -r staging .github/workflows/v304-publication-once.yml
          git commit -m 'Publish verified original-signer v3.0.4 Android update and retire one-time staging'
          git push origin HEAD:main
          test "$(jq -er '.version' version.json)" = '3.0.4'
          test "$(jq -er '.versionCode' version.json)" = 106
          echo 'v3.0.4 release published; v3.0.3 original signed APK preserved.'
