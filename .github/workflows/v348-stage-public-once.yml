name: Stage verified v3.0.48 draft APK
on:
  push:
    branches: [release/v348-public-one-time-20261126]
    paths: [.github/workflows/v348-stage-public-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'stage: verified signed v3.0.48 draft APK (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify exact signed APK
        env:
          BUNDLE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8a58-81f5-a5e8-aef853e8f599/raw?se=2026-11-27T02%3A00%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=20f065ae-6890-54d7-8c73-ea50d295afcc&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T20%3A47%3A33Z&ske=2026-11-27T20%3A47%3A33Z&sks=b&skv=2026-06-06&sig=mqLTiH9pqNB6Gs5PRJCkTbWx%2Bxm/qoU3h6JCr3yLCcI%3D'
        run: |
          set -euo pipefail
          mkdir -p .release-staging
          printf '%s\n' '{"artifact":"Yellow_Hat_Resale_Inventory_and_Taxes_v3.0.48.apk","unsignedBundleSha256":"c8b96359f64c0563b62c516deb748a9cb8374ba8564205959994f852de0e6158","unsignedApkSha256":"adabac05f1c53d0d845c8c5b64d1feb62a3706bde0c022849252d1c3a1c016ff","patchSha256":"eb2b4deb5fec39e322bb69df12d374ce410f1db65027c8fb1a9fde841840b51d","signedApkSha256":"3ef77ed2b0e0e1b04674327d38b3bdbbe2804815de10e7c3e5b3285fb2999fed","signedApkSize":7720514,"assets":545,"sourceSha":"64b25f6b25f3dfb999e1ae50d5583ee7fbdf84f7","certificate":"48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4","regressionTests":"3562/3562 passed from exact extracted package and independent CI"}' > .release-staging/v348-manifest.json

          M=.release-staging/v348-manifest.json
          case "$BUNDLE_URL" in https://*.oaiusercontent.com/files/*) ;; *) exit 1;; esac
          curl -fSsL --retry 2 --connect-timeout 15 --max-time 150 "$BUNDLE_URL" -o /tmp/bundle.zip
          echo "$(jq -r .unsignedBundleSha256 "$M")  /tmp/bundle.zip" | sha256sum -c
          unzip -q /tmp/bundle.zip -d /tmp/yhr332
          find /tmp/yhr332 -type f
          U=$(find /tmp/yhr332 -type f -name '*.apk')
          S=$(find /tmp/yhr332 -type f -name EXACT_SOURCE.txt)
          test -f "$U"
          grep -F '64b25f6b25f3dfb999e1ae50d5583ee7fbdf84f7' "$S"
          echo "$(jq -r .unsignedApkSha256 "$M")  $U" | sha256sum -c
          cat .release-staging/v348-signed-delta.b64 | base64 -d > /tmp/delta.zst
          echo "$(jq -r .patchSha256 "$M")  /tmp/delta.zst" | sha256sum -c
          mkdir -p releases
          A="releases/$(jq -r .artifact "$M")"
          zstd --patch-from="$U" -d -q -f /tmp/delta.zst -o "$A"
          echo "$(jq -r .signedApkSha256 "$M")  $A" | sha256sum -c
          test "$(stat -c %s "$A")" = "$(jq -r .signedApkSize "$M")"
          python - "$U" "$A" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is None and b.testzip() is None
              def entries(z):
                  return {i.filename:hashlib.sha256(z.read(i)).hexdigest() for i in z.infolist() if not i.is_dir() and not i.filename.startswith('META-INF/')}
              x,y=entries(a),entries(b)
              assert x==y
              assert len([n for n in y if n.startswith('assets/www/')])==545
              print('Signed/unsigned payload parity and 545 web assets verified')
          PY
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$SDK/zipalign" -c -v 4 "$A" > /tmp/align.txt
          "$SDK/aapt" dump badging "$A" | grep -F "package: name='com.yellowhatresale.taxes' versionCode='150' versionName='3.0.48'"
          "$SDK/apksigner" verify --verbose --print-certs "$A" | tee /tmp/sign.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 48bf93b7f86d0b5bedf021f20dd189d35216707c8b65ee894150e573a97691a4' /tmp/sign.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/sign.txt
          grep -F 'Number of signers: 1' /tmp/sign.txt
      - name: Stage draft and verify signed asset, without changing feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M=.release-staging/v348-manifest.json
          A="releases/$(jq -r .artifact "$M")"
          HASH=$(jq -r .signedApkSha256 "$M")
          NAME=$(basename "$A")
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" >/tmp/feed-before.json
          test "$(jq -r .sha /tmp/feed-before.json)" = 5de6f396b5f57e6f28a158d4597200d69169c2db
          gh release view v3.0.47 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | jq -e '.isDraft==false and .isPrerelease==false and (.assets|length)>0'
          if gh release view v3.0.48 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refuse replacement'; exit 1; fi
          gh release create v3.0.48 "$A" --draft --repo "$GITHUB_REPOSITORY" --target main --title 'Yellow Hat Resale v3.0.48 — Persistent Import Studio' --notes 'Polished Import Studio settings and persistent browser connection. Existing 32 intake contracts and 18 tools preserved. 3562 mandatory tests passed; original signing key; v3.0.47 retained for rollback.'
          gh release view v3.0.48 --repo "$GITHUB_REPOSITORY" --json isDraft,assets,url | tee /tmp/release.json
          jq -e '.isDraft==true and (.assets|length)==1' /tmp/release.json
          mkdir -p /tmp/readback
          gh release download v3.0.48 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/readback
          echo "$HASH  /tmp/readback/$NAME" | sha256sum -c
          gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=main" >/tmp/feed-after.json
          test "$(jq -r .sha /tmp/feed-after.json)" = 5de6f396b5f57e6f28a158d4597200d69169c2db
          echo 'EXACT SIGNED DRAFT ASSET VERIFIED; LIVE FEED UNCHANGED'
