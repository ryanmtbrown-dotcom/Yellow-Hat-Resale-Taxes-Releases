name: Publish staged APK
on:
  push:
    branches: [main]
    paths:
      - 'staging/**'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          META="staging/release.json"
          OUTPUT="$(jq -r '.output' "$META")"
          EXPECTED_SHA="$(jq -r '.sha256' "$META")"
          mkdir -p "$(dirname "$OUTPUT")"
          cat staging/chunks/*.b64 | tr -d '\r\n' | base64 --decode > "$OUTPUT"
          echo "$EXPECTED_SHA  $OUTPUT" | sha256sum --check -
          cp staging/version.json version.json

      - name: Publish release feed atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/ version.json
          git rm -r staging
          git commit -m "Publish staged Android release"
          git push
